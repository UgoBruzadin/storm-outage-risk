version: 2

seeds:
  - name: stl_metro_counties
    description: >
      The 8 counties of the St. Louis metro study area. A seed is a small CSV
      kept in git and loaded as a table by `dbt seed` (or `dbt build`).
    config:
      column_types:
        fips_code: varchar   # keep leading zeros if a state code ever starts with 0
    columns:
      - name: fips_code
        data_tests:
          - unique
          - not_null

  - name: study_states
    description: >
      THE study area — every state in the analysis. The single source of truth: dbt
      models filter by it, and the ingest scripts read this same file. Add or remove a
      state here, then re-run the fetch-* tasks and `pixi run build`.
      Currently Missouri + Illinois. Tested with the six bordering states too (AR, IA, IN,
      KS, KY, TN — same storm climate, no independent cities); paused for now, see
      docs/decisions.md.
    config:
      column_types: {state_fips: varchar, state_abbr: varchar, state_name: varchar}
    columns:
      - name: state_fips
        data_tests: [unique, not_null]

