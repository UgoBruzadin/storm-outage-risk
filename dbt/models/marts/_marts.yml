version: 2

models:
  - name: mart_study__region_6h
    description: >
      Modeling table: every study-area region x every 6-hour block with the outage
      label, HRRR weather features, place features and storm-report context.
      Storm report columns are context only — never model inputs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]
    columns:
      - name: peak_out
        description: Worst customers-out snapshot in the block; NULL = unknown (EAGLE-I down or blank).
      - name: peak_suspect
        description: True when peak_out > 1.5x the customer count (glitch or too-low customer count).
      - name: peak_pct_out
        description: peak_out as % of customers, capped at 100; NULL when unknown or suspect.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
      - name: has_weather
        description: True when all 6 hours of HRRR weather exist for the block.
        data_tests: [not_null]

  - name: mart_study__region_1h
    description: >
      Moving-window modeling table: every study-area region x every hour from 2018. Features
      use only what had happened by the start of the hour; labels describe the 6 hours
      starting L = 0, 1, 2, 3 or 6 hours later.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, hour]
    columns:
      - name: pct_out
        description: Worst snapshot in the hour as % of customers; NULL = unknown or suspect.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
      - name: hours_since_outage
        description: Hours since the region last had >= 1% out, capped at 720; NULL when the tracker missed too much.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 720}
      - name: fut_max_pct_0
        description: Worst hour in the 6 hours starting at `hour`; NULL unless >= 3 of them are known.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
      - name: has_weather
        description: True when all 6 hours of HRRR weather before `hour` exist.
        data_tests: [not_null]

  - name: mart_study__region_coverage
    description: >
      Whether EAGLE-I was tracking each region in each year: tracked when the share of hours
      with anyone out is at least a fifth of the region's typical share.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, year]
    columns:
      - name: tracked
        data_tests: [not_null]

  - name: mart_study__region_history_asof
    description: >
      Each region's outage track record as of January 1 of each year, from the 3 years
      before it only. The model's history features (joined on region and year).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [as_of_year, region_fips]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "history_end = make_date(as_of_year, 1, 1)"

  - name: mart_study__region_resilience
    description: >
      Resilience scorecard per region from its outage history, 2020–2025 by default.
      Display only; the model's history features come from mart_study__region_history_asof.
    columns:
      - name: region_fips
        data_tests: [unique, not_null]
      - name: storm_hit_rate
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: repeat_7d_share
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
