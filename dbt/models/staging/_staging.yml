# Documentation + tests for the staging models. Every model gets an entry
# here. `dbt build` runs each model, then its tests; a failing test stops
# everything downstream of it.
#
# Built-in tests: unique, not_null, accepted_values, relationships.
# dbt_utils (packages.yml) adds unique_combination_of_columns, accepted_range...
# Anything else: a SQL file in dbt/tests/ that returns the BAD rows.

version: 2

models:
  - name: stg_noaa__kstl_hourly
    description: Hourly weather at KSTL, labeled with the hour it leads into.
    columns:
      - name: hour
        description: Start of the hour this report describes the weather going into (UTC).
        data_tests: [unique, not_null]
      - name: temp_c
        description: Air temperature, °C. NULL when NOAA marked it missing.
      - name: wind_ms
        description: Sustained wind speed, m/s (x 2.237 = mph).
      - name: gust_ms
        description: Peak gust, m/s; equals wind_ms when no gust was reported.
      - name: precip_mm
        description: Precipitation in the past hour, mm.
      - name: thunder
        description: Thunderstorm reported in the past hour (from the METAR text).
        data_tests: [not_null]

  - name: stg_eaglei__outages
    description: EAGLE-I snapshots, national, all years; 2023's "sum" column merged in.
    columns:
      - name: fips_code
        data_tests: [not_null]
      - name: run_start_time
        data_tests: [not_null]

  - name: stg_eaglei__customers
    description: Customers per county (MCC.csv), FIPS zero-padded, 'Grand Total' removed.
    columns:
      - name: fips_code
        data_tests: [unique, not_null]
      - name: customers
        data_tests: [not_null]

  - name: stg_acs__housing
    description: ACS 2020–2024 5-year housing age, housing units, population per study-area county.
    columns:
      - name: fips_code
        data_tests: [unique, not_null]

  - name: stg_geo__regions
    description: Study-area regions (St. Louis City + County merged) with tree canopy.
    columns:
      - name: region_fips
        data_tests: [unique, not_null]
      - name: canopy_mean_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}

  - name: stg_hrrr__hourly
    description: HRRR storm ingredients per region per hour, with u/v wind components.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, hour]

  - name: stg_noaa__storm_events
    description: NOAA Storm Events reports for study-area, times converted to UTC.
    columns:
      - name: begin_utc
        data_tests: [not_null]

  - name: stg_noaa__zone_county
    description: NWS forecast zone -> county FIPS for study-area.
