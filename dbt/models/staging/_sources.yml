# Raw files, declared once and read in models with {{ source(...) }}. Every file is
# downloaded by a script in ingest/ (see the pixi fetch-* tasks), except EAGLE-I.
#
# external_location is passed through Python's str.format() by dbt-duckdb, so it
# can't contain curly braces (e.g. read_csv(types = {...})): such files are read as
# text (all_varchar) and cast in the staging model.

version: 2

sources:
  - name: eaglei
    description: >
      DOE/ORNL EAGLE-I recorded electricity outages: one row per county per
      15-minute snapshot with at least one customer out (UTC). See
      docs/data-notes.md for the quirks. Manual download (data/README.md).
    tables:
      - name: outages
        description: All yearly national files, 2014–2025.
        config:
          external_location: >-
            read_csv('data/raw/eaglei/eaglei_outages_*.csv', union_by_name = true, filename = true)
      - name: modeled_customers
        description: MCC.csv — EAGLE-I's modeled number of customers per county.
        config:
          external_location: "read_csv('data/raw/eaglei/MCC.csv')"

  - name: noaa
    description: >
      NOAA Global Hourly (ISD) observations (ingest/fetch_noaa.py).
      Values are packed text fields (e.g. TMP = '+0039,1').
    tables:
      - name: kstl_observations
        description: St. Louis Lambert airport (KSTL), one file per year.
        config:
          external_location: >-
            read_csv('data/raw/noaa/noaa_KSTL_*.csv', all_varchar = true, union_by_name = true)

  - name: hrrr
    description: >
      NOAA HRRR short-range forecasts of storm ingredients at each region's
      weather point, via Open-Meteo's Historical Forecast API
      (ingest/fetch_weather.py). Hourly, UTC, wind in m/s.
    tables:
      - name: hourly
        description: One file per region per year (the download may still be filling in).
        config:
          external_location: >-
            read_csv('data/raw/weather/hrrr/*.csv.gz', all_varchar = true)

  - name: storm_events
    description: >
      NOAA Storm Events database (ingest/fetch_storm_events.py): severe weather
      reports with times in local standard time (CZ_TIMEZONE, e.g. 'CST-6').
    tables:
      - name: details
        config:
          external_location: >-
            read_csv('data/raw/storm_events/StormEvents_details-*.csv.gz', union_by_name = true, all_varchar = true)
      - name: zone_county
        description: NWS forecast zone -> county FIPS correlation file (pipe-delimited, no header).
        config:
          external_location: >-
            read_csv('data/raw/storm_events/zone_county_*.dbx', delim = '|', header = false, all_varchar = true,
                     names = ['state', 'zone', 'cwa', 'zone_name', 'state_zone', 'county', 'fips', 'time_zone',
                              'fe_area', 'lat', 'lon'])

  - name: geo
    description: Region shapes and place features (ingest/fetch_counties.py, fetch_tree_canopy.py).
    tables:
      - name: regions
        description: Study-area regions with land area and a weather point.
        config:
          external_location: "read_csv('data/raw/geo/regions_study.csv', all_varchar = true)"
      - name: tree_canopy
        description: USFS/NLCD Tree Canopy Cover 2021, summarized per region.
        config:
          external_location: "read_csv('data/raw/geo/tree_canopy_2021.csv', all_varchar = true)"

  - name: acs
    description: >
      Census ACS 2020–2024 5-year estimates, table-based summary files, all U.S.
      geographies (ingest/fetch_acs.py). Columns like B25034_E001 = estimate,
      B25034_M001 = margin of error.
    tables:
      - name: year_built
        description: B25034 — housing units by year structure built.
        config:
          external_location: "read_csv('data/raw/acs/acsdt5y2024-b25034.dat', delim = '|')"
      - name: median_year_built
        description: B25035 — median year structure built.
        config:
          external_location: "read_csv('data/raw/acs/acsdt5y2024-b25035.dat', delim = '|')"
      - name: population
        description: B01003 — total population.
        config:
          external_location: "read_csv('data/raw/acs/acsdt5y2024-b01003.dat', delim = '|')"
      - name: housing_units
        description: B25001 — housing units.
        config:
          external_location: "read_csv('data/raw/acs/acsdt5y2024-b25001.dat', delim = '|')"
