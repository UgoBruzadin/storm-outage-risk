version: 2

models:
  - name: int_study__regions
    description: One row per study-area region with customers, land, canopy and housing features.
    columns:
      - name: region_fips
        data_tests: [unique, not_null]
      - name: customers
        data_tests: [not_null]
      - name: share_homes_pre1960
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}

  - name: int_eaglei__blocks_6h
    description: Every 6-hour block with the national EAGLE-I snapshot count (the heartbeat).
    columns:
      - name: block_start
        data_tests: [unique, not_null]
      - name: n_snapshots
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 24}

  - name: int_eaglei__hours_1h
    description: Every hour with the national EAGLE-I snapshot count (the hourly heartbeat).
    columns:
      - name: hour
        data_tests: [unique, not_null]
      - name: n_snapshots
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 4}

  - name: int_study__region_neighbors
    description: Pairs of nearby regions (within 100 km, or upwind within 200 km) with distance and bearing.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, neighbor_fips]
    columns:
      - name: bearing_deg
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 360}

  - name: int_study__outages_1h
    description: Peak customers out per region per hour (hours with outages only).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, hour]

  - name: int_study__nws_1h
    description: NWS warnings in force and the latest SPC Day 1 outlook at the start of each hour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, hour]

  - name: int_study__outages_6h
    description: Peak/mean customers out per region per 6-hour block (blocks with outages only).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]

  - name: int_study__nws_6h
    description: NWS warnings in force during each block and the SPC Day 1 outlook in force at its start.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]
    columns:
      - name: spc_cat
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
      - name: spc_lead_hours
        description: Hours between the outlook's issue and the block start; always > 0 (no peeking).
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: false}

  - name: int_study__weather_6h
    description: HRRR storm ingredients summarized per region per 6-hour block.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]
    columns:
      - name: n_weather_hours
        data_tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 6}
      - name: precip_prev_72h_mm
        description: Rain in the 72 h before the block; NULL unless all 12 blocks are present.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: precip_prev_7d_mm
        description: Rain in the 7 days before the block; NULL unless all 28 blocks are present.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0}

  - name: int_study__storm_events_6h
    description: NOAA Storm Events report counts per region per 6-hour block.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]
