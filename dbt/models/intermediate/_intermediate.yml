version: 2

models:
  - name: int_study__regions
    description: One row per study-area region with customers, land, canopy and housing features.
    columns:
      - name: region_fips
        data_tests: [unique, not_null]
      - name: customers
        data_tests: [not_null]
      - name: share_homes_pre1960
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}

  - name: int_eaglei__blocks_6h
    description: Every 6-hour block with the national EAGLE-I snapshot count (the heartbeat).
    columns:
      - name: block_start
        data_tests: [unique, not_null]
      - name: n_snapshots
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 24}

  - name: int_study__outages_6h
    description: Peak/mean customers out per region per 6-hour block (blocks with outages only).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]

  - name: int_study__weather_6h
    description: HRRR storm ingredients summarized per region per 6-hour block.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]
    columns:
      - name: n_weather_hours
        data_tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 6}
      - name: precip_prev_72h_mm
        description: Rain in the 72 h before the block; NULL unless all 12 blocks are present.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: precip_prev_7d_mm
        description: Rain in the 7 days before the block; NULL unless all 28 blocks are present.
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0}

  - name: int_study__storm_events_6h
    description: NOAA Storm Events report counts per region per 6-hour block.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region_fips, block_start]
