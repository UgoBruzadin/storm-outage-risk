<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --accent: #2a78d6; --accent-ink: #ffffff; --warm: #eb6834;
  --shadow: 0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --accent: #3987e5; --accent-ink: #0b0b0b; --warm: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --accent: #3987e5; --accent-ink: #0b0b0b; --warm: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 980px; margin: 0 auto; padding: 0 16px 64px; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 12px; }
h2 { font-size: 1.6rem; margin: 64px 0 16px; }
h3 { font-size: 1.1rem; margin: 24px 0 8px; }
p { margin: 0 0 14px; color: var(--ink-2); }
strong { color: var(--ink); }
.hero { padding: 72px 0 8px; }
.lede { font-size: 1.2rem; color: var(--ink-2); max-width: 760px; }
.btn {
  display: inline-block; padding: 11px 18px; border-radius: 8px; font-weight: 600;
  text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--surface);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
figure { margin: 24px 0; }
figure img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); box-shadow: var(--shadow); }
figcaption { font-size: .9rem; color: var(--muted); margin-top: 8px; }
figure.narrow { max-width: 560px; margin-left: auto; margin-right: auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
tr.group td { color: var(--ink); font-weight: 600; text-align: left; background: color-mix(in srgb, var(--line) 35%, transparent); }
td.best { color: var(--ink); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
ul { padding-left: 20px; color: var(--ink-2); }
li { margin: 6px 0; }
.pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.step b { display: block; color: var(--ink); margin-bottom: 4px; }
.step span { font-size: .9rem; color: var(--ink-2); }
.note { border-left: 3px solid var(--warm); padding: 4px 0 4px 14px; margin: 20px 0; }
footer { border-top: 1px solid var(--line); margin-top: 64px; padding-top: 20px; font-size: .9rem; color: var(--muted); }
footer p { color: var(--muted); }
code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: color-mix(in srgb, var(--line) 50%, transparent); padding: 1px 5px; border-radius: 4px; }
.abstract { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin: 40px 0 0; }
.abstract h2 { margin: 0 0 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.abstract p:last-child { margin-bottom: 0; }
.toc { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 0; padding: 0; list-style: none; font-size: .95rem; }
.pitfall { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 18px 20px; margin: 16px 0; }
.pitfall h3 { margin: 0 0 8px; }
.pitfall .tag { display: inline-block; font: 600 .78rem ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }
pre { margin: 12px 0 10px; padding: 12px 14px; overflow-x: auto; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
pre code { background: none; padding: 0; font-size: .82rem; line-height: 1.55; color: var(--ink); }
pre .c { color: var(--muted); }
.fix { font-size: .95rem; }
@media (max-width: 760px) {
  body { font-size: 16px; }
  .grid2, .pipeline { grid-template-columns: 1fr; }
  .hero { padding-top: 40px; }
}

/* Markdown conventions (writeup.md) */
.hero { padding: 72px 0 8px; }
.hero > p { font-size: 1.2rem; color: var(--ink-2); max-width: 760px; }
.buttons ul { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 8px; padding: 0; list-style: none; }
.buttons li { margin: 0; }
.buttons a { display: inline-block; padding: 11px 18px; border-radius: 8px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.buttons strong a { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.stats ul { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 40px 0 0; padding: 0; list-style: none; }
.stats li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0;
  font-size: .9rem; color: var(--muted); }
.stats li > strong:first-child { display: block; font-size: 1.8rem; line-height: 1.1; margin-bottom: 4px; }
.abstract ul:last-child { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 0; padding: 0; list-style: none;
  font-size: .95rem; }
.abstract ul:last-child li { margin: 0; }
blockquote { margin: 8px 0 14px; padding: 0; font-size: .95rem; }
blockquote p { color: var(--ink-2); }
.pitfall > p:first-child > code:only-child { display: inline-block; background: none; padding: 0;
  font: 600 .78rem ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
.pitfall > p:first-child { margin-bottom: 4px; }
.pitfall h3 { margin: 0 0 8px; }
td strong { color: var(--ink); }
footer { border-top: 1px solid var(--line); margin-top: 64px; padding-top: 20px; font-size: .9rem; }
footer p { color: var(--muted); }
#doc:empty::before { content: "Loading…"; color: var(--muted); display: block; padding: 72px 0; }
@media (max-width: 760px) {
  .stats ul { grid-template-columns: repeat(2, 1fr); }
  .hero { padding-top: 40px; }
}
</style>
</head>
<body>
<main id="doc"></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// The page's content is writeup.md (Markdown). Conventions, also listed at the top of that file:
//   ::: name ... :::   a styled box     ## Heading {#id}   a link anchor
//   ![alt](src "Caption")  a captioned figure     > line   a small note     `tag` first in a pitfall card
const containers = md => md
  .replace(/^:::[ \t]*([\w-]+)[ \t]*$/gm, (m, name) => `\n<div class="${name === "footer" ? "footer" : name}">\n`)
  .replace(/^:::[ \t]*$/gm, "\n</div>\n");

function finish(root) {
  root.querySelectorAll("h1, h2, h3").forEach(h => {        // "Title {#id}" -> id="id"
    const m = h.innerHTML.match(/\s*\{#([\w-]+)\}\s*$/);
    if (m) { h.id = m[1]; h.innerHTML = h.innerHTML.slice(0, m.index); }
  });
  root.querySelectorAll("p > img[title]").forEach(img => {   // image title -> figure caption
    const p = img.parentElement, fig = document.createElement("figure"), cap = document.createElement("figcaption");
    cap.innerHTML = marked.parseInline(img.title); img.removeAttribute("title"); img.loading = "lazy";
    fig.append(img); if (cap.textContent.trim()) fig.append(cap); p.replaceWith(fig);
  });
  root.querySelectorAll("p > img").forEach(img => { img.loading = "lazy"; });
  root.querySelectorAll("table").forEach(t => {               // tables scroll sideways on phones
    const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.append(t);
  });
  root.querySelectorAll("pre code").forEach(c => {            // -- and # comments in grey
    c.innerHTML = c.innerHTML.split("\n").map(line =>
      line.replace(/(^|\s)((?:--|#)(?![{\w]).*)$/, '$1<span class="c">$2</span>')).join("\n");
  });
  const footer = root.querySelector("div.footer");
  if (footer) { const f = document.createElement("footer"); f.innerHTML = footer.innerHTML; footer.replaceWith(f); }
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

fetch("writeup.md", { cache: "no-cache" }).then(r => r.text()).then(md => {
  const root = document.getElementById("doc");
  root.innerHTML = marked.parse(containers(md));
  finish(root);
});
</script>
</body>
</html>
