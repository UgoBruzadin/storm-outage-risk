<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Outage Risk, in Two Minutes</title>
<!-- DRAFT (site-usa). TODO(rerun): add the headline ratio to og:description and the image alt once story.json is
     rebuilt; social.jpg is still the Missouri + Illinois image and needs a USA version. -->
<meta name="description" content="How early can you know which counties will lose power in a storm? A county-level outage model for the lower 48 states, tested two hours ahead on a year it never trained on.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ugobruzadin.github.io/storm-outage-risk/">
<meta property="og:title" content="Which US counties will lose power in the next storm, two hours ahead?">
<meta property="og:description" content="A county-level outage model for the lower 48, built on public data and real weather forecasts, tested two hours ahead on 2025 against official warnings and outlooks.">
<meta property="og:image" content="https://ugobruzadin.github.io/storm-outage-risk/assets/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="TODO: describe the USA social image">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<script>
try { const theme = localStorage.getItem("theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --grid: #ecebe5; --accent: #2a78d6; --warm: #eb6834; --idle: #e4e3dc; --other: #c3c2b7;
  --il: #2a78d6; --mo: #eb6834; --green: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --grid: #232321; --accent: #3987e5; --warm: #d95926; --idle: #2c2c2a; --other: #55554f;
    --il: #3987e5; --mo: #d95926; --green: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --grid: #232321; --accent: #3987e5; --warm: #d95926; --idle: #2c2c2a; --other: #55554f;
  --il: #3987e5; --mo: #d95926; --green: #199e70;
}
* { box-sizing: border-box; }
/* no scroll snapping: slides taller than the window (most, on a laptop or phone) were skipped past (mandatory)
   or held at their end (proximity) */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }

/* top bar + progress */
.bar { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); font-size: .9rem; }
.bar a { text-decoration: none; font-weight: 600; }
.bar-right { display: flex; align-items: center; gap: 12px; }
.theme { font: 1rem/1 system-ui, sans-serif; width: 32px; height: 32px; padding: 0; cursor: pointer; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; }
.bar .home { color: var(--ink); }
.progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 11; }
.dots { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 10; display: flex;
  flex-direction: column; gap: 10px; }
.dots a { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots a.on { background: var(--accent); }

/* slides */
.slide { min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
  max-width: 1080px; margin: 0 auto; padding: 84px 56px 48px; }   /* 56px: room for the section dots */
.kicker { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1, h2 { font-size: clamp(1.9rem, 4.4vw, 3.1rem); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 14px; }
.lead { font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--ink-2); max-width: 62ch; margin: 0 0 24px; }
.note { font-size: .85rem; color: var(--muted); max-width: 70ch; margin: 14px 0 0; }
strong { color: var(--ink); }

/* live: today's forecast map, the highest counties beside it */
.beta { display: inline-block; padding: 2px 8px; margin-right: 6px; border-radius: 999px; letter-spacing: .06em;
  background: color-mix(in srgb, var(--warm) 16%, transparent); color: var(--warm); }
.live { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
#map-live { max-height: 52svh; width: auto; max-width: 100%; margin: 0 auto; }
.live-map { min-width: 0; }
.live-side h3 { font-size: 1rem; margin: 0 0 8px; }
#live-top { list-style: none; padding: 0; margin: 0 0 16px; }
#live-top li { display: grid; grid-template-columns: 1fr 4.5em 7em; gap: 12px; align-items: baseline; padding: 6px 0;
  border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
#live-top li em { font-style: normal; text-align: right; font-weight: 600; }
#live-top li span { color: var(--muted); font-size: .85rem; text-align: right; }
#live-top li.calm { display: block; }
#live-top li.calm { color: var(--ink-2); border: 0; }
.live-key { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--ink-2); }
.live-key span::before { content: ""; display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 8px;
  vertical-align: -1px; background: var(--c); box-shadow: inset 0 0 0 var(--ring, 0) var(--ink); }
.live .disclaimer { color: var(--ink-2); }
.live-repo { font-size: .9rem; font-weight: 600; }
.county.alert { stroke: var(--ink); stroke-width: 1.6; }
.county.linked { stroke: var(--ink); stroke-width: 1.4; }
#trees .map svg { max-height: 36svh; }
#trees .tabs { margin-bottom: 12px; }
/* the trees slide's tabs, in labeled groups that wrap instead of scrolling */
#place-tabs { display: grid; gap: 2px; border-bottom: 1px solid var(--line); overflow: visible; }
.tabgroup { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 2px; }
.tabgroup-label { flex: 0 0 8.5em; white-space: nowrap; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); }
#place-tabs .tab { padding: 6px 10px 7px; margin-bottom: 0; }
@media (max-width: 760px) {
  .tabgroup-label { flex-basis: 100%; margin-top: 6px; }
  #place-tabs .tab { padding: 5px 8px 6px; font-size: 0.92rem; }
}
.hit-switch button { all: unset; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.hit-switch button:hover { color: var(--ink-2); }
.hit-switch button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.hit-switch button:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
#trees .lead { margin-bottom: 14px; }
.place-r { margin: 12px 0 4px; font-weight: 600; }

/* storm */
.maps { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.map h3 { font-size: 1rem; margin: 0 0 6px; }
.map svg { max-height: 44svh; width: auto; max-width: 100%; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
/* the storm map zooms (its buttons): keep the counties around it inside the frame */
#map-pred, #map-acc, #map-place, #map-hit, #map-live { overflow: hidden; }
.county { stroke: var(--surface); stroke-width: .25; vector-effect: non-scaling-stroke; }
#map-live .county { stroke-width: .5; }
.county.hit { stroke: var(--ink); stroke-width: 1.3; }
.state { vector-effect: non-scaling-stroke; }
/* the storm: one USA map, zoom buttons over its corner */
.storm-map { position: relative; }
#map-pred { max-height: 62svh; width: auto; max-width: 100%; margin: 0 auto; touch-action: pan-x pan-y; cursor: grab; }
.zoom { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; font: 600 1.05rem/1 system-ui, sans-serif; cursor: pointer; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
/* the app plan: cards */
.cards6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 8px 0 18px; }
.cards6 div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  font-size: .95rem; color: var(--ink-2); }
.cards6 b { display: block; color: var(--ink); margin-bottom: 4px; }
.status { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  background: color-mix(in srgb, var(--warm) 16%, transparent); color: var(--warm); margin: 0 0 16px; }
.pending { color: var(--muted); }
.state { fill: none; stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.play { font: 600 .9rem system-ui, sans-serif; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 7px 16px; cursor: pointer; }
.scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
.when { font-variant-numeric: tabular-nums; font-weight: 600; }
.mlegend { display: none; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); margin-top: 4px; }
.mlegend i { flex: 1; height: 6px; border-radius: 3px; }
.totals { color: var(--ink-2); font-size: .95rem; font-variant-numeric: tabular-nums; }

/* pipeline */
.pipe { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.sources { display: grid; gap: 10px; }
.src { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px;
  opacity: 0; transform: translateX(-24px); transition: opacity .6s, transform .6s; }
.src b { display: block; }
.src span { font-size: .85rem; color: var(--muted); }
.flow { width: 90px; }
.flow-v { display: none; }
.flow-v path { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
.flow path { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center;
  opacity: 0; transform: scale(.94); transition: opacity .8s .9s, transform .8s .9s; }
.table-card .big { font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.table-card .tests { display: inline-block; margin-top: 16px; padding: 5px 12px; border-radius: 999px; font-size: .85rem;
  font-weight: 600; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.played .src { opacity: 1; transform: none; }
.played .table-card { opacity: 1; transform: none; }
.src:nth-child(2) { transition-delay: .12s; } .src:nth-child(3) { transition-delay: .24s; }
.src:nth-child(4) { transition-delay: .36s; } .src:nth-child(5) { transition-delay: .48s; }

/* the traps: one section, a sticky panel of cards; invisible scroll stops behind it open one card each */
.traps { display: block; max-width: none; padding: 0; min-height: 0; position: relative; }
.traps-sticky { position: sticky; top: 0; height: 100svh; max-width: 1080px; margin: 0 auto; padding: 72px 56px 20px;
  display: flex; flex-direction: column; justify-content: center; }
.trap-steps { margin-top: -100svh; }
.trap-steps div { height: 100svh; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 6px 0; }
.card-head { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 12px; align-items: baseline;
  width: 100%; padding: 12px 16px; font-size: 1.08rem; line-height: 1.3; }
.card-head:focus-visible { outline: 2px solid var(--accent); border-radius: 12px; }
.card-head .num { color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.card:not(.open) .card-head b { color: var(--ink-2); font-weight: 600; }
.card-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s ease; }
.card.open .card-body { grid-template-rows: 1fr; }
.card-body > .inner { overflow: hidden; padding: 0 16px; }
.card.open .card-body > .inner { padding-bottom: 14px; }
.card .lead { font-size: 1rem; margin-bottom: 10px; }
.card .note { margin-top: 6px; }

/* does it hold up: one chart, horizontal tabs swap what it shows */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 18px; overflow: auto hidden;
  scrollbar-width: none; }
.tab { all: unset; cursor: pointer; padding: 8px 14px 10px; font-weight: 600; color: var(--muted); white-space: nowrap;
  border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
.holds-lead { min-height: 4.6em; }
.holds-panel { min-height: 340px; }             /* the tallest tab, so switching tabs doesn't move the slide */
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--ink-2); margin: -8px 0 8px; }
.key span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px;
  vertical-align: -1px; background: var(--c); }

/* charts */
.axis text { fill: var(--muted); font-size: 14px; }
.axis path, .axis line { stroke: var(--line); }
.gridline line { stroke: var(--grid); }
.label { fill: var(--ink); font-size: 16px; }
#calib .label, #alert-bars .label, #miss-bars .label, #holds-chart .label,
#choice-chart .label, #state-chart .label { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.label.muted { fill: var(--muted); }
.big-label { fill: var(--ink); font-size: 18px; font-weight: 700; }
.callout { font-weight: 600; margin: 14px 0 0; max-width: 62ch; }
.legend text { fill: var(--muted); font-size: 12px; }

/* end */
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.btn { display: inline-block; padding: 11px 18px; border-radius: 8px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 8px 0 28px; }
.next div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: .95rem; color: var(--ink-2); }
.next b { display: block; color: var(--ink); margin-bottom: 4px; }

.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font-size: .85rem; box-shadow: 0 6px 20px rgba(0,0,0,.12); opacity: 0; transition: opacity .12s; }
.tip b, .tip strong { display: block; }

@media (max-width: 760px) {
  .live { grid-template-columns: 1fr; gap: 16px; }
  #map-live { max-height: 46svh; }
  body { font-size: 16px; }
  h1, h2 { font-size: clamp(1.55rem, 7vw, 2rem); margin-bottom: 10px; }
  .lead { font-size: .98rem; margin-bottom: 14px; }
  .kicker { margin-bottom: 6px; }
  .maps { grid-template-columns: 1fr 1fr; gap: 10px; }
  .map svg { max-height: none; }
  #trees .map svg { max-height: none; }
  .map h3 { font-size: .8rem; line-height: 1.25; margin-bottom: 4px; min-height: 2.5em; }
  .map .legend { display: none; }
  .mlegend { display: flex; }
  .next { gap: 8px; margin-bottom: 16px; }
  .next div { font-size: .88rem; padding: 10px 12px; }
  .controls { margin-top: 8px; gap: 8px 12px; }
  .totals { font-size: .85rem; }
  .src { padding: 8px 14px; }
  .table-card { padding: 18px; }
  .next { grid-template-columns: 1fr; }
  .cards6 { grid-template-columns: 1fr; gap: 8px; }
  .cards6 div { font-size: .88rem; padding: 10px 12px; }
  .pipe { grid-template-columns: 1fr 50px; gap: 0; }   /* boxes, then a trunk down their right side into the card */
  .flow { display: none; }
  .flow-v { display: block; width: 50px; height: 100%; overflow: visible; }
  .table-card { grid-column: 1 / -1; margin-top: 18px; padding: 14px; }
  .table-card .big { font-size: 2rem; }
  .table-card .tests { margin-top: 8px; }
  .dots { display: none; }
  .slide { padding: 72px 16px 40px; }
  .traps { padding: 0; }
  .traps-sticky { padding: 60px 12px 12px; }
  .card-head { font-size: .95rem; padding: 10px 12px; }
  .card .lead { font-size: .9rem; }
  .card .note { display: none; }
}
@media (max-width: 480px) {       /* keep the top bar on one line on phones */
  .bar { padding: 12px; font-size: .78rem; }
  .bar-right { gap: 6px; }
  .bar a { white-space: nowrap; }
  .bar .home { display: none; }                         /* "← Live forecast" is the way home on phones */
  .bar a[data-t="nav.portfolio"] { display: none; }   /* still linked at the end of the page */
}
@media (prefers-reduced-motion: reduce) {
  .src, .table-card, .card-body { transition: none; }
  .flow path, .flow-v path { animation: none; }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<nav class="bar">
  <a class="home" href="usa/" data-t="nav.home"></a>
  <span class="bar-right">
    <a href="usa/" data-t="nav.app"></a>
    <a href="https://ugobruzadin.github.io/portfolio/" data-t="nav.portfolio"></a>
    <a href="writeup/" data-t="nav.writeup"></a>
    <button class="theme" type="button"></button>
  </span>
</nav>
<nav class="dots" aria-label="Sections"></nav>
<div class="tip" role="status"></div>

<main>
<section class="slide" id="storm">
  <p class="kicker" data-t="storm.kicker"></p>
  <h1 data-t="storm.title"></h1>
  <p class="lead" id="storm-lead"></p>
  <div class="storm-map">
    <svg id="map-pred" role="img"></svg>
    <div class="zoom">
      <button type="button" data-zoom="in">+</button>
      <button type="button" data-zoom="out">−</button>
      <button type="button" data-zoom="reset">⤢</button>
    </div>
  </div>
  <div class="controls">
    <button class="play" type="button" data-t="storm.play"></button>
    <input class="scrub" type="range" min="0" value="0" step="1" aria-label="Hour of the storm">
    <span class="when"></span>
    <label class="check"><input type="checkbox" id="storm-actual" checked> <span data-t="storm.actual"></span></label>
  </div>
  <p class="totals" id="storm-totals"></p>
  <p class="note"><span data-t="storm.display"></span> <span data-t="storm.zoom_hint"></span></p>
</section>

<section class="slide" id="data">
  <p class="kicker" data-t="data.kicker"></p>
  <h2 data-t="data.title"></h2>
  <p class="lead" id="data-lead"></p>
  <div class="pipe">
    <div class="sources"></div>
    <svg class="flow" viewBox="0 0 90 250" aria-hidden="true">
      <path d="M0 25 C45 25 45 125 90 125"/><path d="M0 75 C45 75 45 125 90 125"/><path d="M0 125 L90 125"/>
      <path d="M0 175 C45 175 45 125 90 125"/><path d="M0 225 C45 225 45 125 90 125"/>
    </svg>
    <!-- phones: each source's line runs right, then down a shared trunk into the card below -->
    <svg class="flow-v" aria-hidden="true"></svg>
    <div class="table-card">
      <div class="big" id="periods">0</div>
      <div data-t="data.unit"></div>
      <div class="tests" id="tests"></div>
    </div>
  </div>
</section>

<section class="slide traps" id="traps">
  <div class="traps-sticky">
    <p class="kicker" data-t="traps.kicker"></p>
    <h2 data-t="traps.title"></h2>
    <div class="cards">
      <article class="card open">
        <button class="card-head" type="button" aria-expanded="true"><span class="num">1</span>
          <b data-t="traps.gaps.title"></b></button>
        <div class="card-body"><div class="inner" id="gaps">
          <p class="lead" data-t="traps.gaps.lead"></p>
          <svg id="heartbeat" role="img" aria-label="Snapshots recorded per six hours, 21 to 27 May 2024, with a drop on 24 May"></svg>
        </div></div>
      </article>
      <article class="card">
        <button class="card-head" type="button" aria-expanded="false"><span class="num">2</span>
          <b data-t="traps.persist.title"></b></button>
        <div class="card-body"><div class="inner" id="persist">
          <p class="lead" id="persist-lead"></p>
          <svg id="persistence" role="img" aria-label="Score on every period versus on new outages only"></svg>
          <p class="note" data-t="traps.persist.note"></p>
        </div></div>
      </article>
      <article class="card">
        <button class="card-head" type="button" aria-expanded="false"><span class="num">3</span>
          <b data-t="traps.peek.title"></b></button>
        <div class="card-body"><div class="inner" id="peek">

// every word on the page lives in text.yaml: T(key, {name: value}) fills {name} placeholders and turns

let TEXT = {};

const inline = v => escapeHtml(v).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
function T(key, vars = {}) {
  const raw = key.split(".").reduce((o, k) => (o == null ? undefined : o[k]), TEXT);
  if (raw == null) { console.warn("text.yaml has no", key); return key; }
  return inline(raw).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));

function Tp(key, vars) { const d = document.createElement("div"); d.innerHTML = T(key, vars); return d.textContent; }
// phones: each source box sends its own line right, down its own lane (top box outermost, so no line crosses
// another), and the lanes sweep together in curves of different widths into the card below
function verticalFlow() {
  const svg = document.querySelector(".flow-v"), box = document.querySelector(".sources");
  if (!svg || getComputedStyle(svg).display === "none") return;
  const top = box.getBoundingClientRect().top, h = Math.round(box.getBoundingClientRect().height);
  const n = box.children.length, gap = 18, end = h + gap, mid = 26, r = 6;      // gap: space above the card
  svg.setAttribute("viewBox", `0 0 50 ${end}`);
  svg.innerHTML = [...box.children].map((b, i) => {
    const rect = b.getBoundingClientRect(), y = Math.round(rect.top - top + rect.height / 2);
    const lane = 9 + (n - 1 - i) * 8;                         // x of this line's lane: top box furthest right
    const bend = end - 16 - (n - 1 - i) * 10;                 // where it starts curving in: outer lanes earlier
    return `<path d="M0 ${y} H${lane - r} Q${lane} ${y} ${lane} ${y + r} V${bend} ` +
           `C${lane} ${end - 4} ${mid} ${end - 8} ${mid} ${end}"/>`;
  }).join("");
}

}

function countyMap(svg, features, states, fc, width, height) {
  // Albers equal-area for the lower 48 (fitted to whichever counties are passed: the country, or MO + IL live)
  const projection = d3.geoConicEqualArea().parallels([29.5, 45.5]).rotate([96, 0]).fitSize([width, height], fc);
  const path = d3.geoPath(projection);
  const g = svg.append("g");
  const counties = g.selectAll("path.county").data(features).join("path").attr("class", "county").attr("d", path);
  g.selectAll("path.state").data(states).join("path").attr("class", "state").attr("d", path);
  return counties;
}

function hatch(svg, id) {

    .attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)");
  p.append("rect").attr("width", 6).attr("height", 6).attr("fill", "var(--idle)");
  p.append("line").attr("y2", 6).attr("stroke", "var(--other)").attr("stroke-width", 1.5);
}

function legend(svg, x, y, w, colors, domain, ticks, format, title) {
  const id = "g" + Math.random().toString(36).slice(2);
  const grad = svg.append("defs").append("linearGradient").attr("id", id);
  const g = svg.append("g").attr("class", "legend").attr("transform", `translate(${x},${y})`);
  const draw = () => {
    grad.selectAll("stop").data(colors()).join("stop")
      .attr("offset", (d, i, all) => i / (all.length - 1)).attr("stop-color", d => d);
  };
  draw(); repaint.push(draw);
  g.append("rect").attr("width", w).attr("height", 8).attr("rx", 2).attr("fill", `url(#${id})`);
  const s = d3.scaleLinear().domain(domain).range([0, w]);
  g.selectAll("text.t").data(ticks).join("text").attr("class", "t").attr("x", d => s(d)).attr("y", 22)
    .attr("text-anchor", "middle").text(format);
  g.append("text").attr("x", 0).attr("y", -6).text(title);
}

// the live forecast from the storm-outage-live repo, refreshed by its hourly job: latest.json, and hours/ for the past 12 hours
const LIVE = "https://raw.githubusercontent.com/UgoBruzadin/storm-outage-live/main";
function liveNow(data, allFeatures, allStates) {
  const features = allFeatures.filter(f => LIVE_STATES.includes(f.properties.state));

  d3.json(`${LIVE}/latest.json`).then(latest => {
    const level = latest.alert_level, steps = [0.005, 0.01, 0.02, 0.05];
    const color = p => (p >= level ? ramp("blue")[6] : p < steps[0] ? "var(--idle)"
      : ramp("blue")[1 + d3.bisectRight(steps, p) - 1]);
    const scrub = document.querySelector("#live .scrub"), button = document.querySelector("#live .play");
    let frames = [latest], i = 0, timer = null, byId = new Map();
    function show(k) {
      i = k;
      const d = frames[k];

      document.querySelector("#live-lead").innerHTML = T("live.lead", {
        window: `${clock(start, { weekday: "short", hour: "numeric" })}–${clock(end, { hour: "numeric", timeZoneName: "short" })}` });
      const top = d.counties.slice().sort((a, b) => b[1] - a[1]).slice(0, 5);

      list.selectAll("li").remove();
      if (top[0][1] < 0.01) list.append("li").attr("class", "calm").text(Tp("live.calm"));
      list.selectAll("li.row").data(top).join("li").attr("class", "row")
        .html(([id, p, low, high]) => `<b>${names.get(id)}</b><em>${pct1(p)}</em><span>${pct1(low)}–${pct1(high)}</span>`);
      const hours = (Date.now() - new Date(latest.decision_hour)) / 3600e3;
      const decided = clock(d.decision_hour, { weekday: "short", hour: "numeric", timeZoneName: "short" });
      status.innerHTML = hours > 3 ? T("live.stale", { hours: Math.floor(hours) })
        : T("live.status", { decided, runs: d.runs_used.length });
      scrub.value = k;
      d3.select("#live .when").text(Tp("live.when", { decided }));
    }
    counties.on("pointermove", (e, f) => {
      const c = byId.get(f.id); if (!c) return;
      showTip(e, T("live.tip", { name: names.get(f.id), p: pct1(c.p), low: pct1(c.low), high: pct1(c.high) }));
    }).on("pointerleave", hideTip);
    const mins = Math.round((Date.now() - new Date(latest.generated_at)) / 60000);
    const updated = mins < 60 ? `updated ${mins} min ago` : `updated ${Math.round(mins / 60)} h ago`;
    document.querySelector("#live-kicker").textContent = Tp("live.kicker", { updated });
    const paintKey = () => {
      const keys = TEXT.live.key.map((label, i) => `<span style="--c:${i === 0 ? "var(--idle)" : ramp("blue")[i]}">${label}</span>`);
      keys.push(`<span style="--c:${ramp("blue")[6]};--ring:1.5px">${Tp("live.key_alert", { level: pct1(level) })}</span>`);
      document.querySelector("#live-key").innerHTML = keys.join("");
    };
    paintKey(); repaint.push(paintKey);
    show(0);
    repaint.push(() => show(i));

    // the 12 hours before the newest forecast; an hour the job missed has no file, and is left out and counted
    function stop() { clearInterval(timer); timer = null; button.textContent = Tp("storm.play"); }
    scrub.addEventListener("input", () => { stop(); show(+scrub.value); });
    button.addEventListener("click", () => {
      if (timer) { stop(); return; }
      if (i === frames.length - 1) show(0);
      button.textContent = Tp("storm.pause");
      timer = setInterval(() => { if (i >= frames.length - 1) { stop(); return; } show(i + 1); }, 650);
    });
    const past = d3.range(1, 13).map(k => new Date(+new Date(latest.decision_hour) - k * 3600e3).toISOString().slice(0, 13));
    Promise.all(past.map(t => d3.json(`${LIVE}/hours/${t.replace(/[-T]/g, "/")}.json`).catch(() => null))).then(found => {
      const saved = found.filter(Boolean).reverse();
      if (!saved.length) return;
      frames = [...saved, latest];
      scrub.max = frames.length - 1;
      show(frames.length - 1);
      document.querySelector("#live .controls").style.display = "";
      document.querySelector("#live-saved").textContent = Tp("live.saved", { n: saved.length });
    });
  }).catch(() => { status.innerHTML = T("live.error"); });
}

// the storm: one map of the lower 48, the risk decided LEAD hours before each 6-hour window (fill), with the counties
// that were >= 5% out in the window outlined; zoom with the buttons, ctrl + wheel or two fingers, drag to move
function storm(data, features, states, fc) {
  const scale = data.storm_scale || 1, P = v => (v == null ? null : v / scale);
  const W = 960, H = 640, mapH = 580;
  const svg = d3.select("#map-pred").attr("viewBox", `0 0 ${W} ${H}`).attr("aria-label", Tp("storm.map_label"));
  document.querySelector("#storm-lead").innerHTML = T("storm.lead", { counties: fmt(data.counties.length) });
  const view = svg.append("g");
  const pc = countyMap(view, features, states, fc, W, mapH);
  const maxP = Math.min(0.6, d3.max(data.storm.flatMap(s => s.prob.map(P))) || 0.6);
  const colorP = () => d3.scaleSequential(d3.interpolateRgbBasis(ramp("blue"))).domain([0, maxP]).clamp(true);
  legend(svg, W / 2 - 150, H - 34, 300, () => ramp("blue"), [0, maxP], [0, 0.2, 0.4, 0.6].filter(t => t <= maxP), pct,
    Tp("storm.legend_risk"));
  const outlined = svg.append("g").attr("class", "legend").attr("transform", `translate(${W / 2 + 170},${H - 34})`);
  outlined.append("rect").attr("width", 14).attr("height", 10).attr("y", -1).attr("fill", "none")
    .attr("stroke", "var(--ink)").attr("stroke-width", 2);
  outlined.append("text").attr("x", 20).attr("y", 8).text(Tp("storm.legend_actual"));
  // zoom: wheel only with ctrl / cmd (plain scrolling moves the page), one finger scrolls the page, two zoom
  const zoom = d3.zoom().scaleExtent([1, 16]).translateExtent([[0, 0], [W, mapH]])
    .filter(e => (e.type === "wheel" ? e.ctrlKey || e.metaKey : e.type.startsWith("touch") ? e.touches.length > 1 : !e.button))
    .on("zoom", e => view.attr("transform", e.transform));
  svg.call(zoom).style("touch-action", "pan-x pan-y");
  const zoomBy = k => svg.transition().duration(REDUCE ? 0 : 300).call(zoom.scaleBy, k);
  document.querySelectorAll("#storm .zoom button").forEach(b => {
    const k = b.dataset.zoom;
    b.setAttribute("aria-label", Tp(`storm.${k === "in" ? "zoom_in" : k === "out" ? "zoom_out" : "reset"}`));
    b.title = b.getAttribute("aria-label");
    b.addEventListener("click", () => (k === "reset"
      ? svg.transition().duration(REDUCE ? 0 : 400).call(zoom.transform, d3.zoomIdentity) : zoomBy(k === "in" ? 1.6 : 1 / 1.6)));
  });
  const actual = document.querySelector("#storm-actual");
  const scrub = document.querySelector("#storm .scrub");
  scrub.max = data.storm.length - 1;
  scrub.addEventListener("input", () => { stop(); show(+scrub.value); });
  actual.addEventListener("change", () => show(i, false));
  let i = 0, timer = null;
  const clock = (t, opts) => new Date(t).toLocaleString("en-US", { timeZone: "America/Chicago", ...opts });
  function when(start) {
    const t = new Date(start), decided = new Date(t - data.lead * 3600e3), end = new Date(+t + 6 * 3600e3);
    return Tp("storm.when", { window: `${clock(t, { weekday: "short", hour: "numeric" })}–${clock(end, { hour: "numeric" })}`,
                              decided: clock(decided, { hour: "numeric" }) });
  }
  const total = s => d3.sum(Object.values(s.out || {}));
  function show(k, animate = true) {
    i = k;
    const s = data.storm[k];
    const dur = animate && !REDUCE ? 350 : 0;
    pc.transition().duration(dur).attr("fill", (d, j) => (s.prob[j] == null ? css("--idle") : colorP()(P(s.prob[j]))));
    pc.classed("hit", (d, j) => actual.checked && s.pct[j] != null && s.pct[j] >= 5);
    pc.filter(".hit").raise();
    scrub.value = k;
    d3.select("#storm .when").text(when(s.start));
    const top = Object.entries(s.out || {}).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([name, n]) => `${stateAbbr(name)} ${fmt(n)}`).join(", ");
    document.querySelector("#storm-totals").textContent = Tp("storm.totals", { total: fmt(total(s)), top });
  }
  const index = new Map(features.map((f, j) => [f, j]));
  pc.on("pointermove", (e, d) => {
    const s = data.storm[i], j = index.get(d);
    const risk = s.prob[j] == null ? T("storm.tip_none") :
      T("storm.tip_risk", { p: pct(P(s.prob[j])), low: pct(P(s.low[j])), high: pct(P(s.high[j])) });
    showTip(e, `<b>${d.properties.name}, ${stateAbbr(d.properties.state)}</b>${risk}<br>` +
      T("storm.tip_worst", { pct: s.pct[j] == null ? T("storm.tip_unknown") : s.pct[j] + "% out" }));
  }).on("pointerleave", hideTip);
  const button = document.querySelector("#storm .play");
  function stop() { clearInterval(timer); timer = null; button.textContent = Tp("storm.play"); }
  function play() {
    if (timer) { stop(); return; }
    if (i === data.storm.length - 1) show(0);
    button.textContent = Tp("storm.pause");
    timer = setInterval(() => { if (i >= data.storm.length - 1) { stop(); return; } show(i + 1); }, 650);
  }
  button.addEventListener("click", play);
  repaint.push(() => show(i, false));
  if (REDUCE) { show(d3.maxIndex(data.storm, total), false); return; }
  show(0, false);
  onEnter(document.querySelector("#storm"), play);
}

function pipeline(data) {

function heartbeat(data, animate) {
  const still = REDUCE || !animate;
  const W = widthOf("#heartbeat"), narrow = W < 600, H = narrow ? 180 : 230, m = { l: 40, r: 16, t: 28, b: 34 };
  const svg = d3.select("#heartbeat").attr("viewBox", `0 0 ${W} ${H}`);
  const rows = data.heartbeat.map(d => ({ t: new Date(d.start), n: d.n }));
  const x = d3.scaleUtc().domain(d3.extent(rows, d => d.t)).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([0, 26]).range([H - m.b, m.t]);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).tickValues([0, 12, 24]).tickSize(-(W - m.l - m.r)).tickFormat("")).select(".domain").remove();
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`)
    .call(d3.axisBottom(x).ticks(d3.utcDay.every(narrow ? 2 : 1)).tickFormat(d3.utcFormat("%b %-d")));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).tickValues([0, 12, 24])).select(".domain").remove();
  // periods with under half the snapshots: the tracker was down
  rows.filter(d => d.n < 12).forEach(d => svg.insert("rect", ":first-child")
    .attr("x", x(d.t) - 12).attr("width", 24).attr("y", m.t).attr("height", H - m.b - m.t)
    .attr("fill", "var(--warm)").attr("opacity", 0.12));
  const line = svg.append("path").datum(rows).attr("fill", "none").attr("stroke", "var(--accent)").attr("stroke-width", 2.5)
    .attr("d", d3.line().x(d => x(d.t)).y(d => y(d.n)).curve(d3.curveMonotoneX));
  const low = rows.reduce((a, b) => (b.n < a.n ? b : a));
  const note = svg.append("g").attr("opacity", still ? 1 : 0);
  note.append("circle").attr("cx", x(low.t)).attr("cy", y(low.n)).attr("r", 6).attr("fill", "var(--warm)");
  // the label sits in the empty space right of the dip, or under the 24 line on phones
  const lx = narrow ? m.l + 6 : x(low.t) + 76, ly = narrow ? y(17) : y(9);
  if (!narrow) note.append("line").attr("x1", x(low.t) + 6).attr("y1", y(low.n) - 4).attr("x2", lx - 6).attr("y2", ly + 6)
    .attr("stroke", "var(--muted)");
  note.append("text").attr("class", "big-label").attr("x", lx).attr("y", ly).text(Tp("traps.gaps.callout"));
  note.append("text").attr("class", "label muted").attr("x", lx).attr("y", ly + 20)
    .text(Tp("traps.gaps.callout_detail", { n: low.n, when: d3.utcFormat("%-d %b %Y, %H:%M UTC")(low.t) }));
  svg.append("text").attr("class", "label muted").attr("x", m.l + 6).attr("y", y(24) - 10)
    .text(Tp(narrow ? "traps.gaps.chart_label_narrow" : "traps.gaps.chart_label"));
  if (still) return;
  const len = line.node().getTotalLength();
  line.attr("stroke-dasharray", len).attr("stroke-dashoffset", len);
  whenShown("#gaps", () => {
    line.transition().duration(2000).ease(d3.easeCubicInOut).attr("stroke-dashoffset", 0);
    note.transition().delay(1500).duration(500).attr("opacity", 1);
  });
}

// what each version knows, on a clock around the decision: weather it has seen, forecasts, and the 6 hours it predicts

    { name: Tp("traps.peek.row_rebuilt"), score: byKey["No forecasts"].value,

  svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", top - 18).attr("y2", top + rows.length * rowH - 10)
    .attr("stroke", "var(--ink-2)").attr("stroke-width", 1.5);
  svg.append("text").attr("class", "label").attr("x", narrow ? x(0) - 4 : x(0)).attr("y", top - 26)

    .select(".domain").remove();
  const fill = { "seen": "var(--accent)", "seen-future": "var(--warm)", "forecast": "var(--accent)" };

// how many times better than warnings + outlook alone, with paired storm-day ranges
function ladder(data, animate) {
  const still = REDUCE || !animate;
  const official = data.ladder.find(d => d.key === "Warnings + outlook");
  const rows = data.ladder.filter(d => d !== official), ours = rows.find(d => d.ours);
  const pCeiling = data.significance["Perfect weather (ceiling) vs With HRRR forecasts (mean of 5 runs)"];
  document.querySelector("#ladder-title").innerHTML = T("ladder.title", { ratio: ours.ratio.toFixed(1) });
  const ceiling = rows.find(d => d.ceiling), e = data.e55 || {};
  document.querySelector("#ladder-note").innerHTML = T("ladder.note", { decisions: fmt(data.alerts.decisions),
    outages: fmt(data.alerts.new_outages), positive: or(e.positive_hours, fmt), random: data.alerts.base_rate.toFixed(3),
    ceiling: ceiling.ratio.toFixed(1), p_ceiling: pCeiling.toFixed(3) });
  document.querySelector("#ladder-previous").innerHTML = T("ladder.previous", { vs_prev: or(e.vs_previous, v => v.toFixed(2)),
    vs_lo: or(e.vs_previous_lo, v => v.toFixed(2)), vs_hi: or(e.vs_previous_hi, v => v.toFixed(2)),
    better: or(e.better_than_previous, pct), reach: pct(ours.value / ceiling.value) });
  const label = d => TEXT.ladder.labels[d.key] || d.label;
  const W = widthOf("#ladder-chart"), narrow = W < 600, rowH = narrow ? 62 : 56, left = narrow ? 0 : 300, top = 30;
  const svg = d3.select("#ladder-chart").attr("viewBox", `0 0 ${W} ${top + rows.length * rowH + 10}`);
  const x = d3.scaleLinear().domain([0, Math.max(3.8, d3.max(rows, d => d.ratio_hi) * 1.05)])
    .range([0, W - left - (narrow ? 70 : 190)]);
  // the official forecasts: the 1× line every bar is measured against
  const base = svg.append("g").attr("transform", `translate(${left},0)`);
  base.append("line").attr("x1", x(1)).attr("x2", x(1)).attr("y1", top - 8).attr("y2", top + rows.length * rowH - 10)
    .attr("stroke", "var(--muted)").attr("stroke-dasharray", "4 4");
  base.append("text").attr("class", "label muted").attr("x", x(1)).attr("y", top - 14).attr("text-anchor", "middle")
    .style("font-size", "13px").text(Tp(narrow ? "ladder.baseline_narrow" : "ladder.baseline"));
  const g = svg.selectAll("g.row").data(rows).join("g").attr("class", "row")
    .attr("transform", (d, i) => `translate(${left},${top + (narrow ? 18 : 6) + i * rowH})`);
  g.append("text").attr("class", d => "label" + (d.ours ? "" : " muted")).attr("x", narrow ? 0 : -14).attr("y", narrow ? -4 : 22)
    .attr("text-anchor", narrow ? "start" : "end").style("font-weight", d => (d.ours ? 700 : 400)).text(label);
  const bh = narrow ? 22 : 28, by = narrow ? 2 : 3;
  const bars = g.append("rect").attr("height", bh).attr("y", by).attr("rx", 4)
    .attr("fill", d => (d.ceiling ? "none" : d.ours ? "var(--accent)" : "color-mix(in srgb, var(--accent) 45%, var(--surface))"))
    .attr("stroke", d => (d.ceiling ? "var(--muted)" : "none")).attr("stroke-dasharray", "5 4")
    .attr("width", still ? d => x(d.ratio) : 0);
  const whisk = g.append("g").attr("opacity", still ? 1 : 0);
  whisk.append("line").attr("x1", d => x(d.ratio_lo)).attr("x2", d => x(d.ratio_hi)).attr("y1", by + bh / 2).attr("y2", by + bh / 2)
    .attr("stroke", "var(--ink-2)").attr("stroke-width", 1.5);
  whisk.selectAll("line.cap").data(d => [d.ratio_lo, d.ratio_hi]).join("line").attr("class", "cap")

// does it hold up: the open tab's rows of bars; a tab click redraws the chart
let holdsTab = "years", holdsSeen = false;
function holdsUp(data, animate) {
  const h = data.holds, t = TEXT.holds.tabs, tabs = document.querySelector("#holds-tabs");
  if (!tabs.children.length) {
    Object.keys(t).forEach(k => {
      const b = document.createElement("button");
      b.className = "tab"; b.setAttribute("role", "tab"); b.dataset.key = k;
      b.textContent = innerWidth < 600 ? t[k].tab_narrow : t[k].tab;
      b.addEventListener("click", () => {
        holdsTab = k; d3.select("#holds-chart").selectAll("*").remove(); holdsUp(data, holdsSeen);
      });
      tabs.append(b);
    });
  }
  tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.key === holdsTab));
  const tt = t[holdsTab], light = "color-mix(in srgb, var(--accent) 45%, var(--surface))";
  document.querySelector("#holds-lead").innerHTML = T(`holds.tabs.${holdsTab}.lead`,
    { thin: or((data.scope || {}).thin, fmt) });
  document.querySelector("#holds-note").innerHTML = T(`holds.tabs.${holdsTab}.note`);
  const times = v => `${v.toFixed(1)}×`, share = v => `${Math.round(v * 100)}%`;
  let rows, keys, baseline = 1, fmtV = times;
  if (holdsTab === "years") {
    keys = [[tt.key_without, light], [tt.key_with, "var(--accent)"]];
    rows = h.years.map(y => ({ label: String(y.year), bars: [{ v: y.without, c: light },
      ...(y.with ? [{ v: y.with, c: "var(--accent)", strong: true }] : [])] }));
  } else if (holdsTab === "storms") {
    keys = [[tt.key_model, "var(--accent)"], [tt.key_official, "var(--other)"]];
    baseline = null; fmtV = share;
    rows = h.storms.map(r => ({ label: tt.labels[r.key], sub: Tp("holds.tabs.storms.count", { n: fmt(r.n) }),
      bars: [{ v: r.model, c: "var(--accent)", strong: true }, { v: r.official, c: "var(--other)" }] }));
  } else if (holdsTab === "counties") {
    keys = []; fmtV = v => `${v.toFixed(2)}×`;
    rows = [{ label: tt.seen, bars: [{ v: h.counties.seen, c: light }] },
            { label: tt.unseen, bars: [{ v: h.counties.unseen, c: "var(--accent)", strong: true }] }];
  } else {                                     // coverage: trained without the barely covered counties
    keys = []; fmtV = v => `${v.toFixed(2)}×`;
    rows = (data.coverage || []).filter(r => r.scored_on === "all counties" && tt.rows[r.trained_on])
      .map((r, k) => ({ label: tt.rows[r.trained_on], bars: [{ v: r.ratio, c: k ? light : "var(--accent)", strong: !k }] }));
    if (!rows.length) rows = [{ label: Tp("common.pending"), bars: [{ v: 0, c: light }] }];
  }
  document.querySelector("#holds-key").innerHTML = keys.map(([name, c]) => `<span style="--c:${c}">${name}</span>`).join("");
  const W = widthOf("#holds-chart"), narrow = W < 600, left = narrow ? 0 : 230, top = baseline ? 26 : 6;
  const bh = narrow ? 18 : 22, gap = 4, labelH = narrow ? 22 : 0, rowGap = narrow ? 16 : 20;
  const rowH = r => labelH + r.bars.length * (bh + gap) - gap + rowGap;
  const ys = rows.reduce((a, r) => [...a, a[a.length - 1] + rowH(r)], [top]);
  const svg = d3.select("#holds-chart").attr("viewBox", `0 0 ${W} ${ys[ys.length - 1]}`);
  const max = d3.max(rows.flatMap(r => r.bars.map(b => b.v)));
  const x = d3.scaleLinear().domain([0, holdsTab === "storms" ? Math.max(0.5, max) : Math.max(3, max)])
    .range([0, W - left - 70]);
  const plot = svg.append("g").attr("transform", `translate(${left},0)`);
  if (baseline) {
    plot.append("line").attr("x1", x(1)).attr("x2", x(1)).attr("y1", top - 8).attr("y2", ys[ys.length - 1] - rowGap)
      .attr("stroke", "var(--muted)").attr("stroke-dasharray", "4 4");
    plot.append("text").attr("class", "label muted").attr("x", x(1)).attr("y", top - 12).attr("text-anchor", "middle")
      .style("font-size", "13px").text(Tp("holds.baseline"));
  }
  const g = plot.selectAll("g.row").data(rows).join("g").attr("class", "row")
    .attr("transform", (d, i) => `translate(0,${ys[i]})`);
  const lab = g.append("text").attr("class", "label").attr("x", narrow ? 0 : -14).attr("y", narrow ? 14 : bh / 2 + 5)
    .attr("text-anchor", narrow ? "start" : "end").attr("transform", narrow ? `translate(${-left},0)` : null);
  lab.append("tspan").style("font-weight", 600).text(d => d.label);
  lab.append("tspan").attr("dx", 8).style("fill", "var(--muted)").style("font-size", "13px")
    .text(d => (narrow && d.sub ? d.sub : ""));
  g.filter(d => d.sub && !narrow).append("text").attr("class", "label muted").attr("x", -14).attr("y", bh + 20)
    .attr("text-anchor", "end").style("font-size", "13px").text(d => d.sub);
  const bars = g.selectAll("g.bar").data(d => d.bars).join("g").attr("class", "bar")
    .attr("transform", (b, k) => `translate(0,${labelH + k * (bh + gap)})`);
  const still = REDUCE || !animate;
  const rect = bars.append("rect").attr("height", bh).attr("rx", 4).attr("fill", b => b.c)
    .attr("width", b => (still ? x(b.v) : 0));
  const vals = bars.append("text").attr("class", "label").attr("x", b => x(b.v) + 8).attr("y", bh / 2 + 5)
    .style("font-weight", b => (b.strong ? 700 : 400)).attr("opacity", still ? 1 : 0).text(b => fmtV(b.v));
  if (still) return;
  const play = () => {
    holdsSeen = true;
    rect.transition().duration(700).ease(d3.easeCubicOut).attr("width", b => x(b.v));
    vals.transition().delay(500).duration(300).attr("opacity", 1);
  };
  if (holdsSeen) play(); else onEnter(document.querySelector("#holds"), play);
}


// rows of paired horizontal bars, with each row's label on the left (above the bars on phones)
function barRows(sel, section, rows, domainMax, format, animate) {
  const still = REDUCE || !animate;
  const W = widthOf(sel), narrow = W < 600, left = narrow ? 0 : 210, bh = narrow ? 13 : 15, gap = 3;
  const labelH = narrow ? 20 : 0, rowGap = narrow ? 12 : 13, count = rows[0].bars.length;
  const rowH = labelH + count * bh + (count - 1) * gap + rowGap;
  const svg = d3.select(sel).attr("viewBox", `0 0 ${W} ${rows.length * rowH - rowGap}`);
  const x = d3.scaleLinear().domain([0, domainMax]).range([0, W - left - 62]);
  const g = svg.selectAll("g.row").data(rows).join("g").attr("class", "row")
    .attr("transform", (d, i) => `translate(${left},${i * rowH})`);
  const lab = g.append("text").attr("class", "label").attr("x", narrow ? 0 : -14).attr("y", narrow ? 13 : (count * bh + gap) / 2 + 5)
    .attr("text-anchor", narrow ? "start" : "end").style("font-size", narrow ? "14px" : "15px").style("font-weight", 600).text(d => d.label);
  const bars = g.selectAll("g.bar").data(d => d.bars).join("g").attr("class", "bar")
    .attr("transform", (b, k) => `translate(0,${labelH + k * (bh + gap)})`);
  const rect = bars.append("rect").attr("height", bh).attr("rx", 3).attr("fill", b => b.c).attr("width", b => (still ? Math.max(2, x(b.v)) : 0));
  const vals = bars.append("text").attr("class", "label").attr("x", b => Math.max(2, x(b.v)) + 7).attr("y", bh / 2 + 5)
    .style("font-size", "14px").style("font-weight", b => (b.strong ? 700 : 400)).attr("opacity", still ? 1 : 0).text(b => format(b.v));
  if (still) return;
  onEnter(document.querySelector(section), () => {
    rect.transition().duration(800).ease(d3.easeCubicOut).attr("width", b => Math.max(2, x(b.v)));
    vals.transition().delay(600).duration(300).attr("opacity", 1);
  });
}
const barKey = (sel, items) => {
  document.querySelector(sel).innerHTML = items.map(([name, c]) => `<span style="--c:${c}">${name}</span>`).join("");
};

// the storms warnings miss: share of each kind of new outage caught, model against warnings + outlook alerting as often

// what the model said (mean of the five latest forecasts) against how often an outage followed, group by group
function calibration(data, animate) {
  const bins = data.calibration, ex = bins.find(b => b.mean > 0.05 && b.mean < 0.1) || bins[bins.length - 2];
  const top = bins[bins.length - 1], said = "color-mix(in srgb, var(--accent) 40%, var(--surface))", happened = "var(--accent)";
  document.querySelector("#ranges-title").innerHTML = T("ranges.title", { p: pct(ex.mean), observed: pct(ex.observed) });
  document.querySelector("#ranges-lead").innerHTML = T("ranges.lead", { p: pct(ex.mean), observed: pct1(ex.observed),
    low: pct(ex.low), high: pct(ex.high), top_p: pct(top.mean), top_observed: pct(top.observed) });
  barKey("#ranges-key", [[Tp("ranges.key_said"), said], [Tp("ranges.key_happened"), happened]]);
  barRows("#calib", "#ranges", bins.map(b => ({ label: T("ranges.row", { p: pct1(b.mean) }),

function accuracy(data, features, states, fc, animate) {
  const still = REDUCE || !animate;
  const acc = data.accuracy, W = widthOf("#map-acc"), H = Math.round(Math.min(W * 0.66, 620));

  const sc = data.scope || {};

  repaint.push(() => counties.attr("fill", fill));

// state by state: each state's ratio to warnings + outlook with its 95% range; states with too few new outages

    .attr("opacity", still ? 1 : 0);
  g.append("rect").attr("width", colW - 8).attr("height", rowH).attr("fill", "transparent");
  g.append("text").attr("class", "label").attr("x", labelW - 10).attr("y", rowH / 2 + 5).attr("text-anchor", "end")
    .style("font-size", "13px").text(d => d.name);
  g.append("line").attr("x1", d => x(Math.min(d.lo ?? d.ratio, XMAX))).attr("x2", d => x(Math.min(d.hi ?? d.ratio, XMAX)))
    .attr("y1", rowH / 2).attr("y2", rowH / 2).attr("stroke", "var(--ink-2)").attr("stroke-width", 1.3);
  g.filter(d => d.hi > XMAX).append("path").attr("fill", "var(--ink-2)")
    .attr("d", `M${x(XMAX)},${rowH / 2 - 4} l6,4 l-6,4 z`);
  g.append("circle").attr("cx", d => x(Math.min(d.ratio, XMAX))).attr("cy", rowH / 2).attr("r", 4.5).attr("fill", "var(--accent)")
    .attr("stroke", "var(--surface)").attr("stroke-width", 1.2);
  g.append("text").attr("class", "label").attr("x", d => x(Math.min(d.hi ?? d.ratio, XMAX)) + (d.hi > XMAX ? 12 : 8))
    .attr("y", rowH / 2 + 4).style("font-size", "12px").text(d => `${d.ratio.toFixed(1)}×`);
  g.on("pointermove", (e, d) => showTip(e, T("states.tip", { name: d.name, ratio: d.ratio.toFixed(1),
    lo: or(d.lo, v => v.toFixed(1)), hi: or(d.hi, v => v.toFixed(1)), new: fmt(d.new), counties: fmt(d.counties),
    caught: pct(d.caught), official: pct(d.official_caught) }))).on("pointerleave", hideTip);
  if (still) return;
  onEnter(document.querySelector("#states"), () => g.transition().delay((d, k) => k * 25).duration(300).attr("opacity", 1));
}

let placeTab = "road_trees", hitTab = "beyond", placePaint = () => {};
// the trees slide: a county fact on the left (tabs), and on the right either the storm hit rate or the outages
// beyond what the weather and county size predict (ml/place_fragility.py); the line under the maps correlates the two
function trees(data, features, states, fc, animate) {
  const still = REDUCE || !animate;
  const c = data.canopy, p = data.place, ln = data.lines, t = TEXT.trees.tabs, index = new Map(features.map((f, j) => [f, j]));
  const effects = Object.values(c.model || {}).filter(e => e.seeds).map(e => e.mean);
  const roads = (data.choices || []).find(r => r.key === "roads + street canopy");
  const rt = ln.road_trees_by_state || {};
  document.querySelector("#trees-lead").innerHTML = T("trees.lead", {
    roads: roads ? signedPct(roads.gain) : pending(),
    held: roads && have(roads.held_out) ? signedPct(roads.held_out) : pending(),
    canopy_lo: effects.length ? signedPct(d3.min(effects)) : pending(),
    canopy_hi: effects.length ? signedPct(d3.max(effects)) : pending(),
    positive: or(rt.positive, fmt), tested: or(rt.tested, fmt), clear: or(rt.clear, fmt) });
  const thousands = d => (d < 6 ? `${10 ** (d - 3)}k` : "1M");
  const meters = d => (d >= 1000 ? `${+(d / 1000).toFixed(1)} km` : `${Math.round(d)} m`);
  // density, customers and road per customer span orders of magnitude: mapped by their logarithm, shown in plain numbers
  const views = {
    trees: { color: "green", values: c.pct, domain: [0, 70], ticks: [0, 35, 70], tick: d => d + "%", show: d => d + "%" },
    homes: { color: "purple", values: p.homes, domain: [0, 0.6], ticks: [0, 0.2, 0.4, 0.6], tick: pct, show: pct },
    density: { color: "magenta", values: p.density.map(Math.log10), raw: p.density, domain: [0, 3], ticks: [0, 1, 2, 3],
      tick: d => fmt(10 ** d), show: fmt },
    customers: { color: "blue", values: p.customers.map(Math.log10), raw: p.customers, domain: [3, 6], ticks: [3, 4, 5, 6],
      tick: thousands, show: fmt },
    roads: { color: "purple", values: ln.road_m.map(Math.log10), raw: ln.road_m, domain: [Math.log10(30), Math.log10(2000)],
      ticks: [30, 100, 300, 1000].map(Math.log10), tick: d => meters(Math.round(10 ** d)), show: meters },
    road_trees: { color: "green", values: ln.road_treed, domain: [0, 0.5], ticks: [0, 0.25, 0.5],
      tick: d => (d === 0.5 ? "50%+" : pct(d)), show: pct },
    coop: { color: "blue", values: ln.coop, domain: [0, 1], ticks: [0, 0.5, 1], tick: pct, show: pct },
  };
  // right map: storm hit rate, or new outages ÷ what weather and size predict (log2), hatched where barely tracked
  const DIVERGING = { light: ["#184f95", "#6da7ec", "#efeee9", "#f2925f", "#9c3c16"],
                      dark: ["#b7d3f6", "#3987e5", "#2e2d2a", "#eb6834", "#fbd2bf"] };
  const diverging = () => DIVERGING[isDark() ? "dark" : "light"];
  const times = d => ({ "-2": "¼×", "-1": "½×", 0: "1×", 1: "2×", 2: "4×" })[d];
  const rights = {
    hit: { colors: () => ramp("orange"), values: c.hit, domain: [0, 0.3], ticks: [0, 0.1, 0.2, 0.3],
      tick: d => (d === 0.3 ? "30%+" : pct(d)), ok: () => true },
    beyond: { colors: diverging, values: ln.beyond, domain: [-2, 2], ticks: [-2, -1, 0, 1, 2], tick: times,
      ok: j => ln.tracked[j] },
  };
  const left = d3.select("#map-place"), right = d3.select("#map-hit");
  [left, right].forEach(svg => {
    svg.selectAll("*").remove();
    d3.select(svg.node().parentNode).selectAll(".mlegend").remove();
  });
  hatch(right, "hatch-thin");
  const scale = (colors, domain) => d3.scaleSequential(d3.interpolateRgbBasis(colors)).domain(domain).clamp(true);
  const fillPlace = d => {
    const v = views[placeTab], x = v.values[index.get(d)];
    return x == null ? "var(--idle)" : scale(ramp(v.color), v.domain)(x);
  };
  const fillHit = d => {
    const v = rights[hitTab], j = index.get(d);
    return v.ok(j) ? scale(v.colors(), v.domain)(v.values[j]) : "url(#hatch-thin)";
  };
  const fit = fc;
  const placed = countyMap(left, features, states, fit, 460, 290), hit = countyMap(right, features, states, fit, 460, 290);
  placed.attr("fill", fillPlace);
  hit.attr("fill", fillHit);
  const keys = Object.fromEntries(Object.entries(views).map(([k, v]) => {
    const g = left.append("g");
    legend(g, 80, 318, 300, () => ramp(v.color), v.domain, v.ticks, v.tick, Tp(`trees.tabs.${k}.legend`));
    return [k, g];
  }));
  const rightKeys = Object.fromEntries(Object.entries(rights).map(([k, v]) => {
    const g = right.append("g");
    legend(g, 80, 318, 300, v.colors, v.domain, v.ticks, v.tick, Tp(`trees.right.${k}.legend`));
    return [k, g];
  }));
  // a compact legend under each map, shown on phones instead of the in-map one
  const mini = svg => {
    const box = d3.select(svg.node().parentNode).append("div").attr("class", "mlegend");
    const lo = box.append("span"), bar = box.append("i"), hi = box.append("span");
    return (colors, a, b) => { lo.text(a); hi.text(b); bar.style("background", `linear-gradient(to right, ${colors.join(",")})`); };
  };
  const miniLeft = mini(left), miniRight = mini(right);
  const paintMini = () => {
    const v = views[placeTab], h = rights[hitTab];
    miniLeft(ramp(v.color), v.tick(v.domain[0]), v.tick(v.domain[1]));
    miniRight(h.colors(), h.tick(h.domain[0]), h.tick(h.domain[1]));
  };
  // Pearson correlation between the two maps over every county with both values (log where noted)
  const corr = () => {
    const v = views[placeTab], h = rights[hitTab], xs = [], ys = [];
    features.forEach((f, j) => {
      if (v.values[j] == null || h.values[j] == null || !h.ok(j)) return;
      xs.push(v.values[j]); ys.push(h.values[j]);
    });
    const mx = d3.mean(xs), my = d3.mean(ys);
    return d3.sum(xs, (x, i) => (x - mx) * (ys[i] - my)) /
      Math.sqrt(d3.sum(xs, x => (x - mx) ** 2) * d3.sum(ys, y => (y - my) ** 2));
  };
  repaint.push(() => { placed.attr("fill", fillPlace); hit.attr("fill", fillHit); paintMini(); });
  const hitSwitch = document.querySelector("#hit-switch");
  placePaint = fade => {
    const tt = t[placeTab];
    document.querySelector("#place-title").textContent = tt.title;
    left.attr("aria-label", `${tt.title} by county`);
    right.attr("aria-label", Tp(`trees.right.${hitTab}.label`));
    document.querySelector("#place-r").innerHTML = T(`trees.right.${hitTab}.r`, { all: signed(corr()) });
    document.querySelector("#trees-note").innerHTML = hitTab === "hit"
      ? T("trees.note") : T("trees.right.beyond.note", { thin: or((data.scope || {}).thin, fmt) });
    Object.entries(keys).forEach(([k, g]) => g.style("display", k === placeTab ? null : "none"));
    Object.entries(rightKeys).forEach(([k, g]) => g.style("display", k === hitTab ? null : "none"));
    paintMini();
    (fade ? placed.transition().duration(450) : placed).attr("fill", fillPlace);
    (fade ? hit.transition().duration(450) : hit).attr("fill", fillHit);
    document.querySelectorAll("#place-tabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.key === placeTab));
    hitSwitch.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === hitTab));
  };
  const tabs = document.querySelector("#place-tabs");
  if (!tabs.children.length) {
    Object.values(TEXT.trees.groups).forEach(grp => {
      const row = document.createElement("div"), label = document.createElement("span");
      row.className = "tabgroup"; label.className = "tabgroup-label"; label.textContent = grp.label;
      row.append(label);
      grp.tabs.forEach(k => {
        const b = document.createElement("button");
        b.className = "tab"; b.setAttribute("role", "tab"); b.dataset.key = k; b.textContent = t[k].tab;
        b.addEventListener("click", () => { placeTab = k; placePaint(!REDUCE); });
        row.append(b);
      });
      tabs.append(row);
    });
  }
  if (!hitSwitch.children.length) {
    Object.keys(rights).forEach((k, i) => {
      if (i) hitSwitch.append(" · ");
      const b = document.createElement("button");
      b.dataset.key = k; b.textContent = T(`trees.right.${k}.title`);
      b.addEventListener("click", () => { hitTab = k; placePaint(!REDUCE); });
      hitSwitch.append(b);
    });
  }
  placePaint(false);
  [placed, hit].forEach((sel, side) => {
    const other = side ? placed : hit;
    sel.on("pointermove", (e, d) => {
      const j = index.get(d), v = views[placeTab], raw = v.raw ? v.raw[j] : v.values[j];
      const value = raw == null ? "–" : v.show(raw);
      other.classed("linked", o => o === d);
      const tip = hitTab === "hit" ? T("trees.tip", { label: t[placeTab].tip, value, hit: pct(c.hit[j]) })
        : ln.tracked[j] ? T("trees.right.beyond.tip", { label: t[placeTab].tip, value,
          beyond: d3.format(".1f")(2 ** ln.beyond[j]) + "×" })
        : T("trees.right.beyond.tip_thin", { label: t[placeTab].tip, value });
      showTip(e, `<b>${d.properties.name}, ${stateAbbr(d.properties.state)}</b>` + tip);
    }).on("pointerleave", () => { other.classed("linked", false); hideTip(); });
  });
  if (still) return;
  placed.attr("opacity", 0); hit.attr("opacity", 0);
  onEnter(document.querySelector("#trees"), () => {
    placed.transition().delay(200).duration(700).attr("opacity", 1);
    hit.transition().delay(800).duration(700).attr("opacity", 1);
  });
}
</script>
</body>
