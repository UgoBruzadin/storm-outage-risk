<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Outage Risk, in Two Minutes</title>
<meta name="description" content="How early can you know which counties will lose power in a storm? A county-level outage model for Missouri and Illinois, tested two hours ahead on a year it never saw.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ugobruzadin.github.io/storm-outage-risk/">
<meta property="og:title" content="Which counties will lose power in the next storm, two hours ahead?">
<meta property="og:description" content="A county-level outage model built on public data and real weather forecasts. Two hours ahead, it ranks new outages 2.5× better than official warnings alone (95% range 2.1–3.4×), tested on 2025.">
<meta property="og:image" content="https://ugobruzadin.github.io/storm-outage-risk/assets/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Two maps of Missouri and Illinois during the March 2025 storm: outage risk by county, decided two hours ahead, beside the share of customers who actually lost power.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --grid: #ecebe5; --accent: #2a78d6; --warm: #eb6834; --idle: #e4e3dc; --other: #c3c2b7;
  --il: #2a78d6; --mo: #eb6834; --green: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --grid: #232321; --accent: #3987e5; --warm: #d95926; --idle: #2c2c2a; --other: #55554f;
    --il: #3987e5; --mo: #d95926; --green: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --grid: #232321; --accent: #3987e5; --warm: #d95926; --idle: #2c2c2a; --other: #55554f;
  --il: #3987e5; --mo: #d95926; --green: #199e70;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }

/* top bar + progress */
.bar { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); font-size: .9rem; }
.bar a { text-decoration: none; font-weight: 600; }
.bar .home { color: var(--ink); }
.progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 11; }
.dots { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 10; display: flex;
  flex-direction: column; gap: 10px; }
.dots a { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots a.on { background: var(--accent); }

/* slides */
.slide { min-height: 100svh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center;
  max-width: 1080px; margin: 0 auto; padding: 84px 24px 48px; }
.kicker { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1, h2 { font-size: clamp(1.9rem, 4.4vw, 3.1rem); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 14px; }
.lead { font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--ink-2); max-width: 62ch; margin: 0 0 24px; }
.note { font-size: .85rem; color: var(--muted); max-width: 70ch; margin: 14px 0 0; }
strong { color: var(--ink); }

/* storm */
.maps { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.map h3 { font-size: 1rem; margin: 0 0 6px; }
.map svg { max-height: 44svh; width: auto; max-width: 100%; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.county { stroke: var(--surface); stroke-width: .5; }
.state { fill: none; stroke: var(--ink-2); stroke-width: 1; pointer-events: none; }
.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.play { font: 600 .9rem system-ui, sans-serif; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 7px 16px; cursor: pointer; }
.scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
.when { font-variant-numeric: tabular-nums; font-weight: 600; }
.mlegend { display: none; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); margin-top: 4px; }
.mlegend i { flex: 1; height: 6px; border-radius: 3px; }
.totals { color: var(--ink-2); font-size: .95rem; font-variant-numeric: tabular-nums; }

/* pipeline */
.pipe { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.sources { display: grid; gap: 10px; }
.src { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px;
  opacity: 0; transform: translateX(-24px); transition: opacity .6s, transform .6s; }
.src b { display: block; }
.src span { font-size: .85rem; color: var(--muted); }
.flow { width: 90px; }
.flow path { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center;
  opacity: 0; transform: scale(.94); transition: opacity .8s .9s, transform .8s .9s; }
.table-card .big { font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.table-card .tests { display: inline-block; margin-top: 16px; padding: 5px 12px; border-radius: 999px; font-size: .85rem;
  font-weight: 600; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.played .src { opacity: 1; transform: none; }
.played .table-card { opacity: 1; transform: none; }
.src:nth-child(2) { transition-delay: .12s; } .src:nth-child(3) { transition-delay: .24s; }
.src:nth-child(4) { transition-delay: .36s; } .src:nth-child(5) { transition-delay: .48s; }

/* the traps: one section, a sticky panel of cards; invisible scroll stops behind it open one card each */
.traps { display: block; max-width: none; padding: 0; min-height: 0; scroll-snap-align: none; position: relative; }
.traps-sticky { position: sticky; top: 0; height: 100svh; max-width: 1080px; margin: 0 auto; padding: 72px 24px 20px;
  display: flex; flex-direction: column; justify-content: center; }
.trap-steps { margin-top: -100svh; }
.trap-steps div { height: 100svh; scroll-snap-align: start; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 6px 0; }
.card-head { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 12px; align-items: baseline;
  width: 100%; padding: 12px 16px; font-size: 1.08rem; line-height: 1.3; }
.card-head:focus-visible { outline: 2px solid var(--accent); border-radius: 12px; }
.card-head .num { color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.card:not(.open) .card-head b { color: var(--ink-2); font-weight: 600; }
.card-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s ease; }
.card.open .card-body { grid-template-rows: 1fr; }
.card-body > .inner { overflow: hidden; padding: 0 16px; }
.card.open .card-body > .inner { padding-bottom: 14px; }
.card .lead { font-size: 1rem; margin-bottom: 10px; }
.card .note { margin-top: 6px; }

/* charts */
.axis text { fill: var(--muted); font-size: 14px; }
.axis path, .axis line { stroke: var(--line); }
.gridline line { stroke: var(--grid); }
.label { fill: var(--ink); font-size: 16px; }
#savings .label, #lead-chart .label, #calib .label { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.label.muted { fill: var(--muted); }
.big-label { fill: var(--ink); font-size: 18px; font-weight: 700; }
.waffles { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.waffle h3 { font-size: 1rem; margin: 0 0 8px; font-weight: 600; color: var(--ink-2); }
.waffle h3 b, .waffle h3 strong { color: var(--ink); font-size: 1.6rem; display: block; }
.legend text { fill: var(--muted); font-size: 12px; }

/* end */
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.btn { display: inline-block; padding: 11px 18px; border-radius: 8px; font-weight: 600; text-decoration: none;
  border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 8px 0 28px; }
.next div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: .95rem; color: var(--ink-2); }
.next b { display: block; color: var(--ink); margin-bottom: 4px; }

.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font-size: .85rem; box-shadow: 0 6px 20px rgba(0,0,0,.12); opacity: 0; transition: opacity .12s; }
.tip b, .tip strong { display: block; }

@media (max-width: 760px) {
  body { font-size: 16px; }
  h1, h2 { font-size: clamp(1.55rem, 7vw, 2rem); margin-bottom: 10px; }
  .lead { font-size: .98rem; margin-bottom: 14px; }
  .kicker { margin-bottom: 6px; }
  .maps { grid-template-columns: 1fr 1fr; gap: 10px; }
  .map svg { max-height: none; }
  .map h3 { font-size: .8rem; line-height: 1.25; margin-bottom: 4px; min-height: 2.5em; }
  .map .legend { display: none; }
  .mlegend { display: flex; }
  .waffle svg { max-height: 19svh; width: auto; max-width: 100%; }
  .waffle h3 b, .waffle h3 strong { font-size: 1.25rem; }
  .next { gap: 8px; margin-bottom: 16px; }
  .next div { font-size: .88rem; padding: 10px 12px; }
  .controls { margin-top: 8px; gap: 8px 12px; }
  .totals { font-size: .85rem; }
  .src { padding: 8px 14px; }
  .table-card { padding: 18px; }
  .waffles, .next { grid-template-columns: 1fr; }
  .pipe { grid-template-columns: 1fr; }
  .flow { display: none; }
  .dots { display: none; }
  .slide { padding: 72px 16px 40px; }
  .traps { padding: 0; }
  .traps-sticky { padding: 60px 12px 12px; }
  .card-head { font-size: .95rem; padding: 10px 12px; }
  .card .lead { font-size: .9rem; }
  .card .note { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .src, .table-card, .card-body { transition: none; }
  .flow path { animation: none; }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<nav class="bar">
  <a class="home" href="./" data-t="nav.home"></a>
  <a href="writeup/" data-t="nav.writeup"></a>
</nav>
<nav class="dots" aria-label="Sections"></nav>
<div class="tip" role="status"></div>

<main>
<section class="slide" id="storm">
  <p class="kicker" data-t="storm.kicker"></p>
  <h1 data-t="storm.title"></h1>
  <p class="lead" data-t="storm.lead"></p>
  <div class="maps">
    <div class="map"><h3 data-t="storm.map_risk"></h3><svg id="map-pred" viewBox="0 0 460 470" role="img" aria-label="Outage risk by county, decided two hours ahead"></svg></div>
    <div class="map"><h3 data-t="storm.map_actual"></h3><svg id="map-actual" viewBox="0 0 460 470" role="img" aria-label="Worst share of customers out by county in the same six hours"></svg></div>
  </div>
  <div class="controls">
    <button class="play" type="button" data-t="storm.play"></button>
    <input class="scrub" type="range" min="0" value="0" step="1" aria-label="Hour of the storm">
    <span class="when"></span>
    <span class="totals"></span>
  </div>
</section>

<section class="slide" id="data">
  <p class="kicker" data-t="data.kicker"></p>
  <h2 data-t="data.title"></h2>
  <p class="lead" data-t="data.lead"></p>
  <div class="pipe">
    <div class="sources"></div>
    <svg class="flow" viewBox="0 0 90 250" aria-hidden="true">
      <path d="M0 25 C45 25 45 125 90 125"/><path d="M0 75 C45 75 45 125 90 125"/><path d="M0 125 L90 125"/>
      <path d="M0 175 C45 175 45 125 90 125"/><path d="M0 225 C45 225 45 125 90 125"/>
    </svg>
    <div class="table-card">
      <div class="big" id="periods">0</div>
      <div data-t="data.unit"></div>
      <div class="tests" id="tests"></div>
    </div>
  </div>
</section>

<section class="slide traps" id="traps">
  <div class="traps-sticky">
    <p class="kicker" data-t="traps.kicker"></p>
    <h2 data-t="traps.title"></h2>
    <div class="cards">
      <article class="card open">
        <button class="card-head" type="button" aria-expanded="true"><span class="num">1</span>
          <b data-t="traps.gaps.title"></b></button>
        <div class="card-body"><div class="inner" id="gaps">
          <p class="lead" data-t="traps.gaps.lead"></p>
          <svg id="heartbeat" role="img" aria-label="Snapshots recorded per six hours, 21 to 27 May 2024: steady at 24, dropping to 1 on 24 May"></svg>
        </div></div>
      </article>
      <article class="card">
        <button class="card-head" type="button" aria-expanded="false"><span class="num">2</span>
          <b data-t="traps.persist.title"></b></button>
        <div class="card-body"><div class="inner" id="persist">
          <p class="lead" data-t="traps.persist.lead"></p>
          <svg id="persistence" role="img" aria-label="Score on every period versus on new outages only"></svg>
          <p class="note" data-t="traps.persist.note"></p>
        </div></div>
      </article>
      <article class="card">
        <button class="card-head" type="button" aria-expanded="false"><span class="num">3</span>
          <b data-t="traps.peek.title"></b></button>
        <div class="card-body"><div class="inner" id="peek">
          <p class="lead" data-t="traps.peek.lead"></p>
          <svg id="timeline" role="img" aria-label="What each version of the model knows, relative to the decision and the six hours it predicts"></svg>
        </div></div>
      </article>
    </div>
  </div>
  <div class="trap-steps" aria-hidden="true"><div></div><div></div><div></div></div>
</section>

<section class="slide" id="ladder">
  <p class="kicker" data-t="ladder.kicker"></p>
  <h2 id="ladder-title"></h2>
  <svg id="ladder-chart" role="img" aria-label="How many times better than warnings and outlook alone, with 95% ranges, for each version"></svg>
  <p class="note" id="ladder-note"></p>
</section>

<section class="slide" id="lead">
  <p class="kicker" data-t="lead.kicker"></p>
  <h2 data-t="lead.title"></h2>
  <svg id="lead-chart" role="img" aria-label="Score on new outages against hours ahead, for each version"></svg>
  <p class="note" data-t="lead.note"></p>
</section>

<section class="slide" id="alerts">
  <p class="kicker" data-t="alerts.kicker"></p>
  <h2 id="alerts-title"></h2>
  <div class="waffles">
    <div class="waffle"><h3 id="w1-h"></h3><svg id="waffle-avg" viewBox="0 0 400 252" role="img"></svg></div>
    <div class="waffle"><h3 id="w2-h"></h3><svg id="waffle-model" viewBox="0 0 400 252" role="img"></svg></div>
  </div>
  <p class="note" id="alerts-note"></p>
</section>

<section class="slide" id="ranges">
  <p class="kicker" data-t="ranges.kicker"></p>
  <h2 data-t="ranges.title"></h2>
  <p class="lead" id="ranges-lead"></p>
  <svg id="calib" role="img" aria-label="Predicted probability against how often an outage followed, with the range of the five most recent forecasts"></svg>
</section>

<section class="slide" id="where">
  <p class="kicker" data-t="where.kicker"></p>
  <h2 data-t="where.title"></h2>
  <p class="lead" id="where-lead"></p>
  <svg id="map-acc" role="img" aria-label="Share of each county's new outages caught by the model"></svg>
</section>

<section class="slide" id="trees">
  <p class="kicker" data-t="trees.kicker"></p>
  <h2 data-t="trees.title"></h2>
  <p class="lead" id="trees-lead"></p>
  <svg id="scatter" role="img" aria-label="Tree canopy against storm hit rate, one dot per county"></svg>
</section>

<section class="slide" id="value">
  <p class="kicker" data-t="value.kicker"></p>
  <h2 id="value-title"></h2>
  <p class="lead" data-t="value.lead"></p>
  <svg id="savings" role="img" aria-label="Estimated net savings in 2025 from staging crews on each forecast, four scenarios each"></svg>
  <p class="note" data-t="value.note"></p>
</section>

<section class="slide" id="end">
  <p class="kicker" data-t="end.kicker"></p>
  <h2 data-t="end.title"></h2>
  <div class="next"></div>
  <div class="links">
    <a class="btn primary" href="https://storm-outage-risk.streamlit.app" data-t="end.dashboard"></a>
    <a class="btn" href="writeup/" data-t="end.writeup"></a>
    <a class="btn" href="https://github.com/UgoBruzadin/storm-outage-risk" data-t="end.code"></a>
  </div>
  <p class="note" data-t="end.credits"></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
// sequential ramps: near zero recedes toward the surface in both themes
const RAMPS = {
  light: { blue: ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"],
           orange: ["#fde0d2", "#f8b998", "#f2925f", "#eb6834", "#c84f1f", "#9c3c16", "#6e2a0f"] },
  dark: { blue: ["#1f2b3a", "#1c3a63", "#184f95", "#256abf", "#3987e5", "#6da7ec", "#b7d3f6"],
          orange: ["#33231d", "#5c2a14", "#8a3a18", "#c84f1f", "#eb6834", "#f2925f", "#fbd2bf"] },
};
const ramp = name => RAMPS[isDark() ? "dark" : "light"][name];
const fmt = d3.format(",");
const pct = d3.format(".0%");
const pct1 = d3.format(".1%");
const signed = v => (v > 0 ? "+" : "−") + Math.abs(v).toFixed(2);
const stateAbbr = s => (s === "Missouri" ? "MO" : "IL");

// every word on the page lives in text.yaml: T(key, {name: value}) fills {name} placeholders and turns
// **bold** / *italics* into HTML; Tp gives plain text, for SVG labels
let TEXT = {};
const escapeHtml = v => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = v => escapeHtml(v).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
function T(key, vars = {}) {
  const raw = key.split(".").reduce((o, k) => (o == null ? undefined : o[k]), TEXT);
  if (raw == null) { console.warn("text.yaml has no", key); return key; }
  return inline(raw).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
}
function Tp(key, vars) { const d = document.createElement("div"); d.innerHTML = T(key, vars); return d.textContent; }
function applyText() {
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T(el.dataset.t); });
  document.querySelector(".sources").innerHTML = TEXT.data.sources
    .map(d => `<div class="src"><b>${inline(d.what)}</b><span>${inline(d.from)}</span></div>`).join("");
  document.querySelector(".next").innerHTML = TEXT.end.next
    .map(d => `<div><b>${inline(d.title)}</b>${inline(d.text)}</div>`).join("");
}
const tip = document.querySelector(".tip");
function showTip(event, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (event.clientY + 14) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
// run fn once, when el first scrolls into view (at once with reduced motion)
function onEnter(el, fn) {
  if (REDUCE) { fn(); return; }
  // fires once the screen's top passes the middle of the display, however tall the screen is
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { io.disconnect(); fn(); }
  }), { rootMargin: "0px 0px -45% 0px", threshold: 0 });
  io.observe(el);
}
const repaint = [];
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => repaint.forEach(f => f()));

// navigation: progress bar and section dots
const slides = [...document.querySelectorAll(".slide")];
const dots = document.querySelector(".dots");
function buildDots() {           // each section's name in the side dots: <section id>.menu in text.yaml
  slides.forEach(s => {
    const a = document.createElement("a"); a.href = "#" + s.id; a.setAttribute("aria-label", Tp(`${s.id}.menu`));
    a.title = Tp(`${s.id}.menu`); dots.append(a);
  });
}
const spy = new IntersectionObserver(entries => entries.forEach(e => {
  const id = e.target.closest(".slide").id;
  if (e.isIntersecting) dots.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.hash === "#" + id));
}), { threshold: 0.5 });

// the traps: each invisible scroll stop opens one card; a card's title jumps to its stop
const trapCards = [...document.querySelectorAll("#traps .card")];
const trapStops = [...document.querySelectorAll("#traps .trap-steps div")];
function openCard(i) {
  trapCards.forEach((c, k) => {
    const on = k === i;
    if (on && !c.classList.contains("open")) {
      c.classList.add("open");
      setTimeout(() => c.dispatchEvent(new Event("opened")), REDUCE ? 0 : 350);
    } else if (!on) c.classList.remove("open");
    c.querySelector(".card-head").setAttribute("aria-expanded", on);
  });
}
// the open card is the one whose stop holds the middle of the screen
function syncCards() {
  const mid = innerHeight / 2;
  const i = trapStops.findIndex(d => { const r = d.getBoundingClientRect(); return r.top <= mid && r.bottom > mid; });
  if (i >= 0) openCard(i);
}
addEventListener("scroll", syncCards, { passive: true });
trapCards.forEach((c, i) => c.querySelector(".card-head").addEventListener("click", () => {
  openCard(i);
  trapStops[i].scrollIntoView({ behavior: REDUCE ? "auto" : "smooth" });
}));
// run a card's animation once the traps are on screen and that card is open
function whenShown(sel, fn) {
  const card = document.querySelector(sel).closest(".card");
  onEnter(document.querySelector("#traps .traps-sticky"), () => {
    if (card.classList.contains("open")) fn();
    else card.addEventListener("opened", fn, { once: true });
  });
}
const progress = document.querySelector(".progress");
addEventListener("scroll", () => {

function countyMap(svg, features, states, fc, width, height) {
  const projection = d3.geoConicEqualArea().parallels([36.5, 42]).rotate([91.5, 0]).fitSize([width, height], fc);
  const path = d3.geoPath(projection);
  const g = svg.append("g");
  const counties = g.selectAll("path.county").data(features).join("path").attr("class", "county").attr("d", path);
  g.selectAll("path.state").data(states).join("path").attr("class", "state").attr("d", path);
  return counties;
}

function hatch(svg, id) {
  const p = svg.append("defs").append("pattern").attr("id", id).attr("width", 6).attr("height", 6)
    .attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)");
  p.append("rect").attr("width", 6).attr("height", 6).attr("fill", "var(--idle)");
  p.append("line").attr("y2", 6).attr("stroke", "var(--other)").attr("stroke-width", 1.5);
}

function legend(svg, x, y, w, colors, domain, ticks, format, title) {
  const id = "g" + Math.random().toString(36).slice(2);
  const grad = svg.append("defs").append("linearGradient").attr("id", id);
  const g = svg.append("g").attr("class", "legend").attr("transform", `translate(${x},${y})`);
  const draw = () => {
    grad.selectAll("stop").data(colors()).join("stop")
      .attr("offset", (d, i, all) => i / (all.length - 1)).attr("stop-color", d => d);
  };
  draw(); repaint.push(draw);
  g.append("rect").attr("width", w).attr("height", 8).attr("rx", 2).attr("fill", `url(#${id})`);
  const s = d3.scaleLinear().domain(domain).range([0, w]);
  g.selectAll("text.t").data(ticks).join("text").attr("class", "t").attr("x", d => s(d)).attr("y", 22)
    .attr("text-anchor", "middle").text(format);
  g.append("text").attr("x", 0).attr("y", -6).text(title);
}

function storm(data, features, states, fc) {
  const pred = d3.select("#map-pred"), actual = d3.select("#map-actual");
  hatch(pred, "hatch-out");
  hatch(actual, "hatch-out-2");
  const pc = countyMap(pred, features, states, fc, 460, 410);
  const ac = countyMap(actual, features, states, fc, 460, 410);
  const maxP = Math.min(0.6, d3.max(data.storm.flatMap(s => s.prob)));
  const maxO = 25;     // worst share out: 5% is an outage here, so the scale tops out at 25% and clamps
  const colorP = () => d3.scaleSequential(d3.interpolateRgbBasis(ramp("blue"))).domain([0, maxP]).clamp(true);
  const colorO = () => d3.scaleSequential(d3.interpolateRgbBasis(ramp("orange"))).domain([0, maxO]).clamp(true);
  legend(pred, 80, 445, 300, () => ramp("blue"), [0, maxP], [0, 0.2, 0.4, 0.6].filter(t => t <= maxP), pct,
    Tp("storm.legend_risk"));
  legend(actual, 80, 445, 300, () => ramp("orange"), [0, maxO], [0, 5, 10, 15, 20, 25], d => d + (d === 25 ? "%+" : "%"),
    Tp("storm.legend_actual"));
  // a compact legend under each map, shown on phones instead of the in-map one
  const mlegends = [[pred, () => ramp("blue"), "0%", pct(maxP)], [actual, () => ramp("orange"), "0%", maxO + "%+"]]
    .map(([svg, colors, lo, hi]) => {
      const box = d3.select(svg.node().parentNode).append("div").attr("class", "mlegend");
      box.append("span").text(lo); const bar = box.append("i"); box.append("span").text(hi);
      const paint = () => bar.style("background", `linear-gradient(to right, ${colors().join(",")})`);
      paint(); return paint;
    });
  repaint.push(...mlegends);
  const scrub = document.querySelector(".scrub");
  scrub.max = data.storm.length - 1;
  scrub.addEventListener("input", () => { stop(); show(+scrub.value); });
  let i = 0, timer = null;
  const clock = (t, opts) => new Date(t).toLocaleString("en-US", { timeZone: "America/Chicago", ...opts });
  function when(start) {
    const t = new Date(start), decided = new Date(t - data.lead * 3600e3), end = new Date(+t + 6 * 3600e3);
    return Tp("storm.when", { window: `${clock(t, { weekday: "short", hour: "numeric" })}–${clock(end, { hour: "numeric" })}`,
                              decided: clock(decided, { hour: "numeric" }) });
  }
  function show(k, animate = true) {
    i = k;
    const s = data.storm[k];
    const dur = animate && !REDUCE ? 350 : 0;
    pc.transition().duration(dur).attr("fill", (d, j) => (s.already[j] ? "url(#hatch-out)" :
      s.prob[j] == null ? css("--idle") : colorP()(s.prob[j])));
    ac.transition().duration(dur).attr("fill", (d, j) => (s.already[j] ? "url(#hatch-out-2)" :
      s.pct[j] == null ? css("--idle") : colorO()(s.pct[j])));
    scrub.value = k;
    d3.select(".when").text(when(s.start));
    d3.select(".totals").text(Tp("storm.totals", { mo: fmt(s.out_mo), il: fmt(s.out_il) }));
  }
  const tipHtml = (d, j) => {
    const s = data.storm[i];
    const risk = s.already[j] ? T("storm.tip_already") : s.prob[j] == null ? T("storm.tip_none") :
      T("storm.tip_risk", { p: pct(s.prob[j]), low: pct(s.low[j]), high: pct(s.high[j]) });
    return `<b>${d.properties.name}, ${stateAbbr(d.properties.state)}</b>${risk}<br>` +
      T("storm.tip_worst", { pct: s.pct[j] == null ? T("storm.tip_unknown") : s.pct[j] + "% out" });
  };
  [pc, ac].forEach(sel => sel.on("pointermove", (e, d) => showTip(e, tipHtml(d, features.indexOf(d))))
    .on("pointerleave", hideTip));
  const button = document.querySelector(".play");
  function stop() { clearInterval(timer); timer = null; button.textContent = Tp("storm.play"); }
  function play() {
    if (timer) { stop(); return; }
    if (i === data.storm.length - 1) show(0);
    button.textContent = Tp("storm.pause");
    timer = setInterval(() => { if (i >= data.storm.length - 1) { stop(); return; } show(i + 1); }, 650);
  }
  button.addEventListener("click", play);
  repaint.push(() => show(i, false));
  if (REDUCE) { show(d3.maxIndex(data.storm, s => s.out_mo + s.out_il), false); return; }
  show(0, false);
  onEnter(document.querySelector("#storm"), play);
}

function pipeline(data) {
  const el = document.querySelector("#data");
  document.querySelector("#tests").textContent = Tp("data.tests", { n: data.pipeline.tests });

      .tween("text", () => { const n = d3.interpolateRound(0, data.pipeline.hours); return t => { big.textContent = fmt(n(t)); }; });
  });
}

function heartbeat(data, animate) {
  const still = REDUCE || !animate;
  const W = widthOf("#heartbeat"), narrow = W < 600, H = narrow ? 180 : 230, m = { l: 40, r: 16, t: 28, b: 34 };
  const svg = d3.select("#heartbeat").attr("viewBox", `0 0 ${W} ${H}`);
  const rows = data.heartbeat.map(d => ({ t: new Date(d.start), n: d.n }));
  const x = d3.scaleUtc().domain(d3.extent(rows, d => d.t)).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([0, 26]).range([H - m.b, m.t]);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).tickValues([0, 12, 24]).tickSize(-(W - m.l - m.r)).tickFormat("")).select(".domain").remove();
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`)
    .call(d3.axisBottom(x).ticks(d3.utcDay.every(narrow ? 2 : 1)).tickFormat(d3.utcFormat("%b %-d")));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).tickValues([0, 12, 24])).select(".domain").remove();
  // periods with under half the snapshots: the tracker was down
  rows.filter(d => d.n < 12).forEach(d => svg.insert("rect", ":first-child")
    .attr("x", x(d.t) - 12).attr("width", 24).attr("y", m.t).attr("height", H - m.b - m.t)
    .attr("fill", "var(--warm)").attr("opacity", 0.12));
  const line = svg.append("path").datum(rows).attr("fill", "none").attr("stroke", "var(--accent)").attr("stroke-width", 2.5)
    .attr("d", d3.line().x(d => x(d.t)).y(d => y(d.n)).curve(d3.curveMonotoneX));
  const low = rows.reduce((a, b) => (b.n < a.n ? b : a));
  const note = svg.append("g").attr("opacity", still ? 1 : 0);
  note.append("circle").attr("cx", x(low.t)).attr("cy", y(low.n)).attr("r", 6).attr("fill", "var(--warm)");
  // the label sits in the empty space right of the dip, or under the 24 line on phones
  const lx = narrow ? m.l + 6 : x(low.t) + 76, ly = narrow ? y(17) : y(9);
  if (!narrow) note.append("line").attr("x1", x(low.t) + 6).attr("y1", y(low.n) - 4).attr("x2", lx - 6).attr("y2", ly + 6)
    .attr("stroke", "var(--muted)");
  note.append("text").attr("class", "big-label").attr("x", lx).attr("y", ly).text(Tp("traps.gaps.callout"));
  note.append("text").attr("class", "label muted").attr("x", lx).attr("y", ly + 20)
    .text(Tp("traps.gaps.callout_detail", { n: low.n, when: d3.utcFormat("%-d %b %Y, %H:%M UTC")(low.t) }));
  svg.append("text").attr("class", "label muted").attr("x", m.l + 6).attr("y", y(24) - 10)
    .text(Tp(narrow ? "traps.gaps.chart_label_narrow" : "traps.gaps.chart_label"));
  if (still) return;
  const len = line.node().getTotalLength();
  line.attr("stroke-dasharray", len).attr("stroke-dashoffset", len);
  whenShown("#gaps", () => {
    line.transition().duration(2000).ease(d3.easeCubicInOut).attr("stroke-dashoffset", 0);
    note.transition().delay(1500).duration(500).attr("opacity", 1);
  });
}

// what each version knows, on a clock around the decision: weather it has seen, forecasts, and the 6 hours it predicts
function timeline(data, animate) {
  const still = REDUCE || !animate;
  const L = data.lead, byKey = Object.fromEntries(data.ladder.map(d => [d.key, d]));
  const W = widthOf("#timeline"), narrow = W < 600;
  const rows = [
    { name: Tp("traps.peek.row_first"), score: byKey["Perfect weather (ceiling)"].value,
      spans: [{ a: L, b: L + 6, kind: "seen-future", text: Tp("traps.peek.span_storm") }] },
    { name: Tp("traps.peek.row_rebuilt"), score: byKey["No forecasts"].value,
      spans: [{ a: -6, b: 0, kind: "seen", text: Tp("traps.peek.span_past") }], marks: true },
    { name: Tp("traps.peek.row_forecasts"), score: byKey["With HRRR forecasts (mean of 5 runs)"].value, ours: true,
      spans: [{ a: -6, b: 0, kind: "seen", text: Tp("traps.peek.span_past") },
              { a: L, b: L + 6, kind: "forecast", text: Tp("traps.peek.span_forecast") }], marks: true },

    .attr("fill", "var(--warm)").attr("opacity", 0.08);
  svg.append("text").attr("class", "label muted").attr("x", (x(L) + x(L + 6)) / 2).attr("y", top - 26)
    .attr("text-anchor", "middle").style("font-size", "13px").text(Tp(narrow ? "traps.peek.window_narrow" : "traps.peek.window"));
  svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", top - 18).attr("y2", top + rows.length * rowH - 10)
    .attr("stroke", "var(--ink-2)").attr("stroke-width", 1.5);
  svg.append("text").attr("class", "label").attr("x", narrow ? x(0) - 4 : x(0)).attr("y", top - 26)
    .attr("text-anchor", narrow ? "end" : "middle")

  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${top + rows.length * rowH - 6})`)
    .call(d3.axisBottom(x).tickValues([-6, 0, L, L + 6]).tickFormat(d => (d === 0 ? Tp("traps.peek.now") : d > 0 ? `+${d} h` : `${d} h`)))
    .select(".domain").remove();
  const fill = { "seen": "var(--accent)", "seen-future": "var(--warm)", "forecast": "var(--accent)" };

// how many times better than warnings + outlook alone, with paired storm-day ranges
function ladder(data, animate) {
  const still = REDUCE || !animate;
  const official = data.ladder.find(d => d.key === "Warnings + outlook");
  const rows = data.ladder.filter(d => d !== official), ours = rows.find(d => d.ours);
  const pCeiling = data.significance["Perfect weather (ceiling) vs With HRRR forecasts (mean of 5 runs)"];
  document.querySelector("#ladder-title").innerHTML = T("ladder.title", { ratio: ours.ratio.toFixed(1) });
  document.querySelector("#ladder-note").innerHTML = T("ladder.note", { decisions: fmt(data.alerts.decisions),
    outages: fmt(data.alerts.new_outages), p_ceiling: pCeiling.toFixed(2) });
  const label = d => TEXT.ladder.labels[d.key] || d.label;
  const W = widthOf("#ladder-chart"), narrow = W < 600, rowH = narrow ? 62 : 56, left = narrow ? 0 : 300, top = 30;
  const svg = d3.select("#ladder-chart").attr("viewBox", `0 0 ${W} ${top + rows.length * rowH + 10}`);
  const x = d3.scaleLinear().domain([0, 3.8]).range([0, W - left - (narrow ? 70 : 190)]);
  // the official forecasts: the 1× line every bar is measured against
  const base = svg.append("g").attr("transform", `translate(${left},0)`);
  base.append("line").attr("x1", x(1)).attr("x2", x(1)).attr("y1", top - 8).attr("y2", top + rows.length * rowH - 10)
    .attr("stroke", "var(--muted)").attr("stroke-dasharray", "4 4");
  base.append("text").attr("class", "label muted").attr("x", x(1)).attr("y", top - 14).attr("text-anchor", "middle")
    .style("font-size", "13px").text(Tp(narrow ? "ladder.baseline_narrow" : "ladder.baseline"));
  const g = svg.selectAll("g.row").data(rows).join("g").attr("class", "row")
    .attr("transform", (d, i) => `translate(${left},${top + (narrow ? 18 : 6) + i * rowH})`);
  g.append("text").attr("class", d => "label" + (d.ours ? "" : " muted")).attr("x", narrow ? 0 : -14).attr("y", narrow ? -4 : 22)
    .attr("text-anchor", narrow ? "start" : "end").style("font-weight", d => (d.ours ? 700 : 400)).text(label);
  const bh = narrow ? 22 : 28, by = narrow ? 2 : 3;
  const bars = g.append("rect").attr("height", bh).attr("y", by).attr("rx", 4)
    .attr("fill", d => (d.ceiling ? "none" : d.ours ? "var(--accent)" : "color-mix(in srgb, var(--accent) 45%, var(--surface))"))
    .attr("stroke", d => (d.ceiling ? "var(--muted)" : "none")).attr("stroke-dasharray", "5 4")
    .attr("width", still ? d => x(d.ratio) : 0);
  const whisk = g.append("g").attr("opacity", still ? 1 : 0);
  whisk.append("line").attr("x1", d => x(d.ratio_lo)).attr("x2", d => x(d.ratio_hi)).attr("y1", by + bh / 2).attr("y2", by + bh / 2)
    .attr("stroke", "var(--ink-2)").attr("stroke-width", 1.5);
  whisk.selectAll("line.cap").data(d => [d.ratio_lo, d.ratio_hi]).join("line").attr("class", "cap")
    .attr("x1", v => x(v)).attr("x2", v => x(v)).attr("y1", by + 5).attr("y2", by + bh - 5).attr("stroke", "var(--ink-2)")
    .attr("stroke-width", 1.5);
  const vals = g.append("text").attr("class", "label").attr("y", by + bh / 2 + 5).attr("x", d => x(d.ratio_hi) + 10)
    .attr("opacity", still ? 1 : 0).style("font-weight", d => (d.ours ? 700 : 400));
  vals.append("tspan").text(d => `${d.ratio.toFixed(1)}×`);
  vals.append("tspan").attr("class", "muted").style("fill", "var(--muted)").style("font-weight", 400).style("font-size", "13px")
    .text(d => (narrow ? "" : Tp("ladder.bar_detail", { lo: d.ratio_lo.toFixed(1), hi: d.ratio_hi.toFixed(1),
                                                         score: d.value.toFixed(3) })));
  if (still) return;
  onEnter(document.querySelector("#ladder"), () => {
    bars.transition().delay((d, i) => i * 350).duration(800).ease(d3.easeCubicOut).attr("width", d => x(d.ratio));
    whisk.transition().delay((d, i) => 600 + i * 350).duration(400).attr("opacity", 1);
    vals.transition().delay((d, i) => 600 + i * 350).duration(400).attr("opacity", 1);
  });
}

function leadTime(data, animate) {
  const still = REDUCE || !animate;
  const W = widthOf("#lead-chart"), narrow = W < 600, H = narrow ? 400 : 400;
  const m = { l: narrow ? 44 : 56, r: narrow ? 12 : 250, t: 24, b: narrow ? 104 : 44 };
  const svg = d3.select("#lead-chart").attr("viewBox", `0 0 ${W} ${H}`);
  const x = d3.scaleLinear().domain([0, 6]).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([0, 0.11]).range([H - m.b, m.t]);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat("")).select(".domain").remove();
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`)
    .call(d3.axisBottom(x).tickValues([0, 1, 2, 3, 6]).tickFormat(d => d + " h"));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5))
    .select(".domain").remove();
  svg.append("text").attr("class", "label muted").attr("x", W - m.r).attr("y", H - m.b + 38).attr("text-anchor", "end")
    .text(Tp("lead.axis"));
  const colors = ["var(--other)", "var(--warm)", "var(--accent)"];
  const series = data.lead_time.map((s, k) => ({ ...s, label: TEXT.lead.labels[s.key] || s.label, color: colors[k] }));
  const line = d3.line().x(p => x(p.lead)).y(p => y(p.value));
  const paths = svg.selectAll("path.s").data(series).join("path").attr("class", "s").attr("fill", "none")
    .attr("stroke", d => d.color).attr("stroke-width", d => (d.color === "var(--accent)" ? 3 : 2.2)).attr("d", d => line(d.points));
  svg.selectAll("g.pts").data(series).join("g").attr("class", "pts").selectAll("circle").data(d => d.points.map(p => ({ ...p, s: d })))
    .join("circle").attr("cx", p => x(p.lead)).attr("cy", p => y(p.value)).attr("r", 4.5).attr("fill", p => p.s.color)
    .attr("stroke", "var(--surface)").attr("stroke-width", 1.5)
    .on("pointermove", (e, p) => showTip(e, `<b>${p.s.label}</b>${p.lead} h ahead: ${p.value.toFixed(3)}`)).on("pointerleave", hideTip);
  // the forecast version, tested at 2 h
  const f = data.ladder.find(d => d.ours);
  const star = svg.append("g").attr("opacity", still ? 1 : 0);
  star.append("circle").attr("cx", x(2)).attr("cy", y(f.value)).attr("r", 8).attr("fill", "var(--accent)")
    .attr("stroke", "var(--surface)").attr("stroke-width", 2);
  star.append("text").attr("class", "label").attr("x", x(2) + 14).attr("y", y(f.value) - 8).style("font-weight", 700)
    .text(Tp(narrow ? "lead.point_narrow" : "lead.point", { score: f.value.toFixed(3) }));
  // direct labels at the right end of each line (a legend on phones)
  if (!narrow) {
    svg.selectAll("text.end").data(series).join("text").attr("class", "label end")
      .attr("x", x(6) + 12).attr("y", d => y(d.points[d.points.length - 1].value) + 5 + (d.color === "var(--warm)" ? 8 : d.color === "var(--other)" ? -4 : 0))
      .style("fill", d => d.color).style("font-size", "14px").text(d => d.label);
  } else {
    const lg = svg.append("g").attr("transform", `translate(${m.l},${H - m.b + 50})`);
    series.forEach((s, k) => {
      lg.append("rect").attr("x", 0).attr("y", k * 18 - 6).attr("width", 14).attr("height", 4).attr("fill", s.color);
      lg.append("text").attr("class", "label").attr("x", 20).attr("y", k * 18).style("font-size", "12px").text(s.label);
    });
  }
  if (still) return;
  paths.each(function () {
    const len = this.getTotalLength();
    d3.select(this).attr("stroke-dasharray", len).attr("stroke-dashoffset", len);
  });
  onEnter(document.querySelector("#lead"), () => {
    paths.transition().delay((d, i) => i * 500).duration(1400).ease(d3.easeCubicInOut).attr("stroke-dashoffset", 0);
    star.transition().delay(2200).duration(500).attr("opacity", 1);
  });
}

function alerts(data) {
  const a = data.alerts, m = a.model, cols = 40, r = 3.6, gap = 10;
  const nAvg = Math.round(a.base_rate * 1000), nModel = Math.round(m.precision * 1000);
  document.querySelector("#alerts-title").innerHTML = T("alerts.title", { times: Math.round(m.precision / a.base_rate) });
  document.querySelector("#w1-h").innerHTML = T("alerts.avg", { n: nAvg });
  document.querySelector("#w2-h").innerHTML = T("alerts.model", { n: nModel });
  document.querySelector("#alerts-note").innerHTML = T("alerts.note", { share: pct1(a.share), caught: pct(m.caught),
    outages: fmt(a.new_outages), spells: fmt(m.episodes), official_precision: pct(a.official.precision),
    official_caught: pct(a.official.caught), newest_caught: pct(a.newest.caught), newest_spells: fmt(a.newest.episodes) });
  const grids = [["#waffle-avg", nAvg], ["#waffle-model", nModel]].map(([id, lit]) => {
    const svg = d3.select(id).attr("aria-label", `${lit} of 1,000 dots lit`);
    const order = d3.shuffle(d3.range(1000));
    const rank = new Map(order.map((v, k) => [v, k]));
    return svg.selectAll("circle").data(d3.range(1000).map(i => ({ i, lit: rank.get(i) < lit, rank: rank.get(i) })))
      .join("circle").attr("cx", d => 6 + (d.i % cols) * gap).attr("cy", d => 6 + Math.floor(d.i / cols) * gap).attr("r", r)
      .attr("fill", d => (REDUCE && d.lit ? "var(--warm)" : "var(--idle)"));
  });
  onEnter(document.querySelector("#alerts"), () => grids.forEach(sel =>
    sel.filter(d => d.lit).transition().delay(d => 300 + d.rank * 9).duration(300).attr("fill", "var(--warm)")));
}

// predicted probability (mean of the five latest forecasts) against how often an outage followed
function calibration(data, animate) {
  const still = REDUCE || !animate;
  const bins = data.calibration, ex = bins.find(b => b.mean > 0.05 && b.mean < 0.1) || bins[bins.length - 2];
  document.querySelector("#ranges-lead").innerHTML = T("ranges.lead", { p: pct(ex.mean), low: pct(ex.low),
    high: pct(ex.high), observed: pct1(ex.observed) });
  const W = widthOf("#calib"), narrow = W < 600, H = narrow ? 360 : 440, m = { l: narrow ? 64 : 84, r: 20, t: 16, b: 62 };
  const svg = d3.select("#calib").attr("viewBox", `0 0 ${W} ${H}`);
  const x = d3.scaleLog().domain([0.001, 0.6]).range([m.l, W - m.r]);
  const y = d3.scaleLog().domain([0.001, 0.6]).range([H - m.b, m.t]);
  const ticks = [0.001, 0.003, 0.01, 0.03, 0.1, 0.3];
  const f = d => (d < 0.01 ? d3.format(".1%")(d) : pct(d));
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).tickValues(ticks).tickSize(-(W - m.l - m.r)).tickFormat("")).select(".domain").remove();
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(f));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).tickValues(ticks).tickFormat(f))
    .select(".domain").remove();
  svg.append("line").attr("x1", x(0.001)).attr("y1", y(0.001)).attr("x2", x(0.6)).attr("y2", y(0.6))
    .attr("stroke", "var(--muted)").attr("stroke-dasharray", "4 4");
  // a key in the empty upper-left corner: the dashed line, and the dot with its range
  const key = svg.append("g").attr("transform", `translate(${m.l + 14},${m.t + 14})`);
  key.append("line").attr("x2", 26).attr("y1", 6).attr("y2", 6).attr("stroke", "var(--muted)").attr("stroke-dasharray", "4 4");
  key.append("text").attr("class", "label muted").attr("x", 34).attr("y", 11).style("font-size", "13px")
    .text(Tp("ranges.key_line"));
  key.append("line").attr("y1", 30).attr("y2", 30).attr("x1", 0).attr("x2", 26).attr("stroke", "var(--accent)")
    .attr("stroke-width", 6).attr("stroke-linecap", "round").attr("opacity", 0.35);
  key.append("circle").attr("cx", 13).attr("cy", 30).attr("r", 5).attr("fill", "var(--accent)");
  key.append("text").attr("class", "label muted").attr("x", 34).attr("y", 35).style("font-size", "13px")
    .text(Tp(narrow ? "ranges.key_bar_narrow" : "ranges.key_bar"));
  svg.append("text").attr("class", "label muted").attr("x", (m.l + W - m.r) / 2).attr("y", H - 14)
    .attr("text-anchor", "middle").text(Tp("ranges.axis_x"));
  svg.append("text").attr("class", "label muted").attr("text-anchor", "middle")
    .attr("transform", `translate(${narrow ? 14 : 20},${(m.t + H - m.b) / 2}) rotate(-90)`)
    .text(Tp("ranges.axis_y"));
  const g = svg.selectAll("g.bin").data(bins).join("g").attr("class", "bin").attr("opacity", still ? 1 : 0);
  g.append("line").attr("x1", d => x(d.low)).attr("x2", d => x(d.high)).attr("y1", d => y(d.observed)).attr("y2", d => y(d.observed))
    .attr("stroke", "var(--accent)").attr("stroke-width", 6).attr("stroke-linecap", "round").attr("opacity", 0.35);
  g.append("circle").attr("cx", d => x(d.mean)).attr("cy", d => y(d.observed)).attr("r", narrow ? 6 : 7).attr("fill", "var(--accent)")
    .attr("stroke", "var(--surface)").attr("stroke-width", 2)
    .on("pointermove", (e, d) => showTip(e, T("ranges.tip", { p: f(d.mean), low: f(d.low), high: f(d.high),
      observed: f(d.observed), n: fmt(d.n) }))).on("pointerleave", hideTip);
  if (still) return;
  onEnter(document.querySelector("#ranges"), () => g.transition().delay((d, i) => 200 + i * 220).duration(500).attr("opacity", 1));
}

function savings(data, animate) {
  const still = REDUCE || !animate;
  const v = data.value, W = widthOf("#savings"), narrow = W < 600, rowH = narrow ? 48 : 50;
  const left = narrow ? 0 : 250, right = narrow ? 8 : 150;
  const model = v.forecasts.find(f => f.ours).scenarios;
  const lo = d3.min(model), hi = d3.max(model);
  document.querySelector("#value-title").innerHTML = T("value.title", { high: hi.toFixed(1) });
  const label = d => TEXT.value.labels[d.key] || d.label;
  const svg = d3.select("#savings").attr("viewBox", `0 0 ${W} ${36 + v.forecasts.length * rowH}`);
  const all = v.forecasts.flatMap(f => f.scenarios);
  const x = d3.scaleLinear().domain([Math.min(0, d3.min(all)), d3.max(all)]).nice().range([left, W - right]);
  const money = m => (Math.abs(m) < 0.05 ? "$0" : `${m < 0 ? "−" : ""}$${Math.abs(m).toFixed(1)}M`);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(0,${16 + v.forecasts.length * rowH})`)
    .call(d3.axisBottom(x).ticks(narrow ? 4 : 5).tickSize(-(v.forecasts.length * rowH)).tickFormat(""))
    .select(".domain").remove();
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${16 + v.forecasts.length * rowH})`)
    .call(d3.axisBottom(x).ticks(narrow ? 4 : 5).tickFormat(d => (d === 0 ? "0" : `${d < 0 ? "−" : ""}$${Math.abs(d)}M`)))
    .select(".domain").remove();
  svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", 6).attr("y2", 16 + v.forecasts.length * rowH)
    .attr("stroke", "var(--ink-2)");
  const color = f => (f.ours ? "var(--accent)" : f.key === "perfect" ? "var(--muted)" : "var(--other)");
  const g = svg.selectAll("g.row").data(v.forecasts).join("g").attr("class", "row")
    .attr("transform", (d, i) => `translate(0,${(narrow ? 30 : 24) + i * rowH})`);
  g.append("text").attr("class", d => "label" + (d.ours ? "" : " muted")).attr("x", narrow ? 0 : left - 14)
    .attr("y", narrow ? -12 : 5).attr("text-anchor", narrow ? "start" : "end").style("font-weight", d => (d.ours ? 700 : 400))
    .text(label);
  const lo_ = d => d3.min(d.scenarios), hi_ = d => d3.max(d.scenarios);
  const bands = g.append("rect").attr("y", -5).attr("height", 10).attr("rx", 5).attr("fill", color).attr("opacity", 0.35)
    .attr("x", d => (still ? x(lo_(d)) : x(0))).attr("width", d => (still ? x(hi_(d)) - x(lo_(d)) : 0));
  const dotsSel = g.selectAll("circle").data(d => d.scenarios.map((m, k) => ({ m, k, f: d }))).join("circle")
    .attr("r", narrow ? 4.5 : 5.5).attr("fill", d => color(d.f)).attr("stroke", "var(--surface)").attr("stroke-width", 1.5)
    .attr("cx", d => (still ? x(d.m) : x(0)))
    .on("pointermove", (e, d) => {
      const s = v.scenarios[d.k];
      showTip(e, `<b>${label(d.f)}: ${money(d.m)}</b>` + T("value.tip", { cut: pct(s.cut), cost: fmt(s.cost) }));
    }).on("pointerleave", hideTip);
  const vals = g.append("text").attr("class", "label").attr("y", 5).attr("opacity", still ? 1 : 0)
    .attr("x", d => (narrow ? W - right : x(hi_(d)) + 12)).attr("text-anchor", narrow ? "end" : "start")
    .attr("dy", narrow ? -17 : 0).style("font-size", narrow ? "13px" : null)
    .text(d => `${money(lo_(d))} to ${money(hi_(d))}`);
  if (still) return;
  onEnter(document.querySelector("#value"), () => {
    const delay = (d, i) => 300 + i * 250;
    bands.transition().delay(delay).duration(900).ease(d3.easeCubicOut)
      .attr("x", d => x(lo_(d))).attr("width", d => x(hi_(d)) - x(lo_(d)));
    dotsSel.transition().delay(d => 300 + v.forecasts.indexOf(d.f) * 250).duration(900).ease(d3.easeCubicOut)
      .attr("cx", d => x(d.m));
    vals.transition().delay((d, i) => 900 + i * 250).duration(500).attr("opacity", 1);
  });
}

function accuracy(data, features, states, fc, animate) {
  const still = REDUCE || !animate;
  const acc = data.accuracy, W = widthOf("#map-acc"), H = Math.round(Math.min(W * 0.8, 560));
  const svg = d3.select("#map-acc").attr("viewBox", `0 0 ${W} ${H}`);
  const judged = acc.new.map(n => n >= acc.min_events);
  const share = acc.new.map((n, j) => (judged[j] ? acc.caught[j] / n : null));
  document.querySelector("#where-lead").innerHTML = T("where.lead", { caught: pct(d3.sum(acc.caught) / d3.sum(acc.new)),
    min: acc.min_events });
  hatch(svg, "hatch");
  const counties = countyMap(svg, features, states, fc, W, H - 10);
  const color = () => d3.scaleSequential(d3.interpolateRgbBasis(ramp("blue"))).domain([0, 1]);
  const fill = (d, j) => (judged[j] ? color()(share[j]) : "url(#hatch)");
  counties.attr("fill", still ? fill : "var(--surface)").attr("opacity", still ? 1 : 0);
  legend(svg, 4, 26, Math.min(140, W * 0.3), () => ramp("blue"), [0, 1], [0, 0.5, 1], pct, Tp("where.legend"));
  counties.on("pointermove", (e, d) => {
    const j = features.indexOf(d);
    showTip(e, `<b>${d.properties.name}, ${stateAbbr(d.properties.state)}</b>` +
      (judged[j] ? T("where.tip", { caught: acc.caught[j], new: acc.new[j] }) : T("where.tip_few", { new: acc.new[j] })));
  }).on("pointerleave", hideTip);
  repaint.push(() => counties.attr("fill", fill));
  if (still) return;
  onEnter(document.querySelector("#where"), () => counties.transition()
    .delay((d, j) => 200 + (judged[j] ? share[j] * 1600 : 1800)).duration(500).attr("opacity", 1).attr("fill", fill));
}

function trees(data, animate) {
  const still = REDUCE || !animate;
  const c = data.canopy, W = widthOf("#scatter"), narrow = W < 600, H = narrow ? 360 : 420;
  const m = { l: narrow ? 44 : 60, r: 16, t: 28, b: 46 };
  const svg = d3.select("#scatter").attr("viewBox", `0 0 ${W} ${H}`);
  const mo = c.model.Missouri, il = c.model.Illinois, sgn = v => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(1) + "%";
  document.querySelector("#trees-lead").innerHTML = T("trees.lead", { r_mo: signed(c.r.Missouri), mo: sgn(mo.mean),
    il: sgn(il.mean), better: il.better, seeds: il.seeds });
  const pts = c.pct.map((p, j) => ({ p, h: c.hit[j], state: data.counties[j].state, name: data.counties[j].name }));
  const x = d3.scaleLinear().domain([0, 75]).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([0, d3.max(pts, d => d.h) * 1.08]).range([H - m.b, m.t]).nice();
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`)
    .call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat("")).select(".domain").remove();
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`)
    .call(d3.axisBottom(x).ticks(narrow ? 4 : 8).tickFormat(d => d + "%"));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(pct))
    .select(".domain").remove();
  svg.append("text").attr("class", "label muted").attr("x", W - m.r).attr("y", H - 6).attr("text-anchor", "end")
    .text(Tp("trees.axis_x"));
  svg.append("text").attr("class", "label muted").attr("x", m.l).attr("y", m.t - 12)
    .text(Tp(narrow ? "trees.axis_y_narrow" : "trees.axis_y"));
  const stateColor = d => (d.state === "Missouri" ? "var(--mo)" : "var(--il)");
  const dotsSel = svg.selectAll("circle").data(pts).join("circle").attr("cx", d => x(d.p)).attr("cy", d => y(d.h))
    .attr("r", narrow ? 4 : 5.5).attr("stroke", "var(--surface)").attr("stroke-width", 1.2)
    .attr("fill", still ? stateColor : "var(--muted)").attr("opacity", 0.85)
    .on("pointermove", (e, d) => showTip(e, `<b>${d.name}, ${stateAbbr(d.state)}</b>` +
      `canopy ${d.p}% · storm hit rate ${pct(d.h)}`)).on("pointerleave", hideTip);
  const fits = ["Missouri", "Illinois"].map(state => {
    const s = pts.filter(d => d.state === state), mx = d3.mean(s, d => d.p), my = d3.mean(s, d => d.h);
    const b = d3.sum(s, d => (d.p - mx) * (d.h - my)) / d3.sum(s, d => (d.p - mx) ** 2);
    const [x0, x1] = d3.extent(s, d => d.p);
    return { state, x0, x1, y0: my + b * (x0 - mx), y1: my + b * (x1 - mx), r: c.r[state] };
  });
  const lines = svg.selectAll("g.fit").data(fits).join("g").attr("class", "fit").attr("opacity", still ? 1 : 0);
  lines.append("line").attr("x1", d => x(d.x0)).attr("x2", d => x(d.x1)).attr("y1", d => y(d.y0)).attr("y2", d => y(d.y1))
    .attr("stroke", d => (d.state === "Missouri" ? "var(--mo)" : "var(--il)")).attr("stroke-width", 3);
  // labels at the end of each line, above a rising line and below a falling one, inside the chart
  lines.append("text").attr("class", "big-label").attr("text-anchor", "end")
    .attr("x", d => Math.min(x(d.x1), W - m.r)).attr("y", d => y(d.y1) + (d.r > 0 ? -12 : 24))
    .text(d => `${d.state} ${signed(d.r)}`);
  if (still) return;
  onEnter(document.querySelector("#trees"), () => {
    dotsSel.transition().delay(900).duration(900).attr("fill", stateColor);
    lines.transition().delay(1800).duration(700).attr("opacity", 1);
  });
}
