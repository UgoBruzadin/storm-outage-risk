# Every word on the story page (site/index.html), in page order.
#
# Edit, save, refresh: the page reads this file directly, no build step. (Locally, serve the site folder,
# e.g. `python3 -m http.server -d site`, since browsers won't load it from file://.)
#
#   >-             a paragraph: line breaks inside it are ignored, so wrap lines however you like
#   **bold**, *italics*   work everywhere
#   {name}         a number filled in from the data (site/data/story.json); the comment above says which.
#                  Move it, drop it, or reword around it, but keep the braces and the name as they are.
#
# The link preview (title, description, image text shown on LinkedIn, Slack, ...) is in the <head> of
# site/index.html, not here: link previews are read without running the page.

nav:
  home: "⚡ Storm Outage Risk"
  writeup: "Full write-up →"

live:
  menu: Live now                       # the name in the side dots' tooltip
  beta: Beta
  # {updated}: e.g. "updated 25 min ago"
  kicker: "Live forecast · {updated}"
  title: Which counties could lose power in the next few hours?
  # {window}: the 6 hours forecast, e.g. "Sun 2 PM–8 PM CST"
  lead: >-
    Forecasts tell utilities *when* a storm will hit. Repair crews need to know *where*, early enough to get there.
    Every hour, this model gives each Missouri and Illinois county its chance of a new outage (5% or more of its
    customers losing power) in the 6 hours starting 2 hours later. This forecast covers **{window}**.
  top: Highest chances in this forecast
  calm: Every county under 1%. A calm stretch.
  key:                                  # the map's color steps, lowest to highest
    - under 0.5%
    - 0.5–1%
    - 1–2%
    - 2–5%
    - 5% or more
  # {level}: the alert level, e.g. "7.4%"
  key_alert: "Alert (≥ {level}): the riskiest 0.75% of county-hours"
  # {decided}: decision time; {runs}: how many HRRR forecast runs it averaged
  status: >-
    Decided {decided} from the {runs} latest HRRR forecasts. Each forecast is saved before the weather happens and
    will be graded against official outage records: a blind test.
  # {hours}: how old the newest forecast is
  stale: "The newest forecast is {hours} hours old: the hourly job may have missed runs."
  error: The live forecast couldn't be loaded right now. The rest of the page works without it.
  disclaimer: >-
    Experimental research forecast, not from any utility or the National Weather Service. Don't use it for safety
    decisions.
  model: >-
    Frozen model live-v1.1, without current outage data: 2.2× official warnings on 2025, against 2.4× for the full
    model below. It can't see if a county is already out, and still gives it a number.
  repo: Every forecast, hour by hour →
  # {name}: county; {p}: chance; {low}, {high}: lowest and highest of the forecast runs
  tip: "**{name}**{p} chance of a new outage (forecast runs: {low}–{high})"
  map_label: Chance of a new outage by county in the coming 6-hour window

storm:
  menu: A past storm                   # the name in the side dots' tooltip
  kicker: 14–15 March 2025 · Missouri and Illinois
  title: Here it is on a storm it never saw.
  lead: >-
    One of 2025's worst storms, a year it never trained on, replayed hour by hour: the risk map, decided two hours
    ahead, next to what actually happened. This display version has the full model's inputs but also counts outages
    already underway, so its map follows the storm. Its scores aren't quoted anywhere; the results below are for new
    outages only.
  map_risk: Risk, decided 2 hours before
  map_actual: "What happened: worst share of customers out"
  legend_risk: "chance of being ≥ 5% out in the 6 hours"
  legend_actual: "worst share of customers out in the 6 hours"
  play: ▶ Play
  pause: ❚❚ Pause
  # {window}: e.g. "Fri 7 PM–1 AM"; {decided}: e.g. "5 PM"
  when: "{window} CDT · decided {decided}"
  # {mo}, {il}: customers out at that hour
  totals: "Out now: Missouri {mo} · Illinois {il}"
  tip_none: no prediction
  # {p}: the prediction; {low}, {high}: lowest and highest of the five forecasts
  tip_risk: "risk {p} (five latest forecasts: {low}–{high})"
  # {pct}: worst share out, e.g. "12.5% out"
  tip_worst: "worst in the 6 hours: {pct}"
  tip_unknown: unknown

data:
  menu: The data
  kicker: The data
  title: Five public sources, one table.
  lead: >-
    Every county, every hour, 2020 to 2025: what the weather did, what forecasters predicted, what the place is like,
    and how many customers lost power.
  sources:                              # the five boxes: what, and where from
    - what: Outages, every 15 minutes
      from: DOE EAGLE-I
    - what: Weather, every hour
      from: NOAA HRRR via Open-Meteo
    - what: Weather forecasts, as issued
      from: NOAA HRRR archive (University of Utah)
    - what: Official warnings and outlooks
      from: NWS, SPC via the Iowa Environmental Mesonet
    - what: What each place is like
      from: Tree canopy, Census housing
  unit: county-hours
  # {n}: number of dbt tests
  tests: "{n} automated data tests"

traps:
  menu: Three traps
  kicker: Pitfalls
  title: Three (caught) misleading model pitfalls.
  gaps:
    title: No record doesn't mean no outage.
    lead: >-
      The federal tracker only logs counties that have customers out. When the tracker itself goes quiet, every county
      looks fine. So the pipeline checks the whole country's pulse first: if the tracker was down, the county's outage
      is **unknown**, not zero.
    chart_label: snapshots per 6 hours, whole country (24 = normal)
    chart_label_narrow: snapshots per 6 h, whole country
    callout: "Tracker down: unknown, not zero"
    # {n}: snapshots recorded; {when}: date and time
    callout_detail: "{n} of 24 snapshots, {when}"
  persist:
    title: "Predicting outages already underway."
    lead: >-
      Most outages last for hours, so "it's out now, it'll still be out" scores very well. That's a real forecast, of
      how long outages last, but it answers a different question from "which calm county goes dark next?", and mixing
      the two inflates the score fourfold. Everything here is scored on **new** outages only.
    bar_all: Scoring every period
    bar_new: Scoring new outages only
    note: >-
      Score: PR-AUC, how well real outages are ranked ahead of false alarms. Random guessing scores the outage rate
      itself, about 0.005. Measured on the first, 6-hour version of the model.
  peek:
    title: "My first model saw the storm coming, because it saw the storm."
    lead: >-
      The first version summarized the weather *during* the hours it was predicting. That's not a leak in the code,
      but nobody knows that weather in advance. Rebuilt so that every input is known at the moment of the decision,
      the score dropped by a third. Real forecasts win most of it back.
    window: the 6 hours being predicted
    window_narrow: predicted
    decision: decision
    now: now
    row_first: First version
    row_rebuilt: "Rebuilt: known at the decision"
    row_forecasts: Rebuilt + HRRR forecasts
    span_storm: the storm itself
    span_past: weather so far
    span_forecast: what the forecasts said
    marker: warnings and outlook in force at the decision

ladder:
  menu: The result
  kicker: The result · 2025, a year the model never saw
  # {ratio}: how many times better than warnings + outlook, e.g. "2.5"
  title: "Two hours ahead, the model ranks new outages {ratio}× better than official warnings alone."
  baseline: warnings + outlook alone = 1×
  baseline_narrow: official = 1×
  # {lo}, {hi}: 95% range of the ratio; {score}: the PR-AUC
  bar_detail: "  ({lo}–{hi}) · score {score}"
  # {decisions}: decisions scored; {outages}: new outages; {p_ceiling}: p-value, ceiling vs forecasts
  note: >-
    Each bar: how many times better than NWS warnings + SPC outlook alone at ranking new outages of ≥ 5% of customers
    in the 6 hours starting 2 hours after each decision, every county and hour of 2025 ({decisions} decisions,
    {outages} new outages). Whiskers: the 95% range when 2025's storm days are resampled, both scored on the same
    days. Every version beat the official forecasts in all 1,000 resamples (p < 0.001). Knowing the weather in advance
    is not significantly better than the real forecasts (p = {p_ceiling}). The live forecast at the top of this page is
    the last-five-forecasts version without current outage data: 2.2× (1.8–3.0×), 14.4% of its alerts real, 29.5% of
    outages caught.
  labels:                               # the bars, top to bottom
    No forecasts: Model, weather observed so far
    With HRRR forecasts (newest run): Model + latest HRRR forecast
    With HRRR forecasts (mean of 5 runs): Model + last five HRRR forecasts
    Perfect weather (ceiling): "Ceiling: knowing the weather in advance"

lead:
  menu: Lead time
  kicker: Looking further ahead
  title: Weather that has already happened fades within hours. Forecasts carry further.
  note: >-
    Score on new outages of ≥ 5% of customers in the 6 hours that start this many hours after the decision, 2025. The
    HRRR forecast versions were tested 2 hours ahead.
  axis: hours ahead
  labels:                               # the lines
    official: Warnings + outlook alone
    weather: Model, weather so far only
    model: Model + warnings + outlook
  # {score}: the forecast version's score at 2 hours
  point: "+ last five HRRR forecasts: {score}"
  point_narrow: "+ HRRR forecasts: {score}"

alerts:
  menu: Alerts
  kicker: If a utility acted on it
  # {times}: how many times the average, e.g. "31"
  title: "Its alerts were {times}× more likely to be real."
  # {n}: out of 1,000
  avg: "**{n} in 1,000**calm county-hours were followed by a major new outage"
  model: "**{n} in 1,000**of the hours the model alerted on were"
  # {share}: share of hours alerted; {caught}, {official_caught}, {newest_caught}: share of new outages caught;
  # {outages}: new outages; {spells}, {newest_spells}: alert spells; {official_precision}: share of official alerts that were real
  note: >-
    Major = at least 5% of a county's customers, in the 6 hours starting 2 hours later, with no outage in the day
    before. Alerts on the riskiest {share} of county-hours caught {caught} of all {outages} major new outages in 2025,
    in {spells} separate alert spells. Warnings + outlook alone, alerting just as often, were right {official_precision}
    of the time and caught {official_caught}. Using only the newest forecast instead of the last five catches a little
    more ({newest_caught}) but alerts switch on and off as each run moves the storm: {newest_spells} spells. A utility
    would set its alert level in advance: fixed on 2024's forecasts, it gives the same result in 2025 (alerts on 0.77%
    of hours, 14.8% real, 29.9% caught). Even so, about 85% of alerts weren't followed by a major new outage and about
    70% of outages got no alert: this says where to look first, not what will happen.

ranges:
  menu: Ranges
  kicker: How sure is each alert?
  title: Every prediction comes with a range, showing how much the forecasts disagree.
  # {p}: a typical prediction; {low}, {high}: its range; {observed}: how often an outage followed
  lead: >-
    The model is run once on each of the five most recent HRRR forecasts, so every prediction comes with a low and a
    high. Take every county-hour where the model gave about a **{p}** chance of a new outage, with the five forecasts
    ranging from {low} to {high}: an outage followed in **{observed}** of them. Every group lands close to the dashed
    line and inside its range; only the riskiest runs a little high. That's a check on groups: the range isn't a 95%
    interval for any one county.
  key_line: "on the line: happened as often as predicted"
  key_bar: "bar: lowest to highest of the 5 latest forecasts"
  key_bar_narrow: "range: the 5 latest forecasts"
  axis_x: what the model predicted
  axis_y: how often an outage followed
  # {p}, {low}, {high}, {observed}, {n}: as above, {n} = county-hours in the group
  tip: "**Predicted {p} (range {low}–{high})**an outage followed {observed} of {n} county-hours"

where:
  menu: Where it works
  kicker: County by county, 2025
  title: Where it works, and where it can't tell yet.
  # {caught}: share of new outages caught overall; {min}: minimum new outages to judge a county
  lead: >-
    Darker counties had more of their new outages caught in time by the alerts above. Overall the model caught
    {caught} of them. Hatched counties had fewer than {min} new outages in 2025, too few to judge.
  legend: share caught
  # {caught} of {new}
  tip: "{caught} of {new} new outages caught"
  tip_few: "{new} new outages: too few to judge"

holds:
  menu: Does it hold up?
  kicker: Does it hold up?
  title: Not one lucky year, one kind of storm, or a few familiar counties.
  baseline: official = 1×
  tabs:                                 # the tabs, left to right
    years:
      tab: Every year
      tab_narrow: Years
      lead: >-
        Tested the same way on 2022, 2023 and 2024, each time trained only on the years before, it beat the official
        forecasts every year. With HRRR forecasts the edge grows.
      key_without: Model, weather observed so far
      key_with: + last five HRRR forecasts
      note: >-
        Times better than NWS warnings + SPC outlook at ranking new outages, 2 hours ahead. The archived forecasts
        cover 2024 and 2025 so far; earlier years are being added.
    storms:
      tab: Every kind of storm
      tab_narrow: Storm types
      lead: >-
        It catches more of every kind of outage, and the gap is widest in winter: warnings and outlooks are built for
        thunderstorms and say little about ice and snow.
      key_model: Model alerts
      key_official: Warnings + outlook, alerting as often
      # {n}: new outages of this kind in 2025
      count: "{n} new outages"
      note: >-
        Share of 2025's new outages caught in time, alerting on the riskiest 0.75% of county-hours. Each outage is
        labelled by the conditions when it started: winter (a winter warning, or near freezing), thunderstorm (storm
        energy or a severe-thunderstorm or tornado warning), or wind and rain without storm energy, the hard case for
        both.
      labels:
        convective: Thunderstorms
        winter: Winter and ice
        other: Wind and rain, no storm energy
    counties:
      tab: Counties it never saw
      tab_narrow: New counties
      lead: >-
        Trained with a fifth of the counties held out each time, it still beat the official forecasts in counties it
        had never seen, losing only a little of its edge. A utility could use it beyond the area it was built on.
      seen: Counties it trained on
      unseen: Counties it never saw
      note: >-
        Times better than NWS warnings + SPC outlook at ranking new outages in 2025, 2 hours ahead, model without HRRR
        forecasts in both.

trees:
  menu: Trees
  kicker: The hunch that started it
  title: Trees matter, just not the way I expected.
  # {r_mo}: correlation in Missouri; {mo}, {il}: what canopy adds to the model in each state;
  # {better} of {seeds}: seeds where it helped in Illinois
  lead: >-
    I expected tree-heavy counties to fail more often in storms, and in Missouri they do (r = {r_mo}). But Missouri's
    most wooded counties are the Ozarks, also remote, hilly and sparsely served, and the model already sees that.
    Given the tree data, it barely improves in Missouri ({mo}) and improves a little in Illinois (**{il}**, better
    with {better} of {seeds} seeds), where the few wooded river counties stand out. Trees are a small, real signal,
    not the main story.
  axis_x: tree canopy cover
  axis_y: "storm hit rate: share of storm periods that caused an outage, 2020–2025"
  axis_y_narrow: storm hit rate, 2020–2025

value:
  menu: What it's worth
  kicker: What it's worth · an estimate for 2025
  # {high}: the model's best scenario, in millions
  title: >-
    Sending crews where the model pointed would have saved up to ${high} million in 2025. Following the official
    forecasts would have lost money.
  lead: >-
    Suppose a utility had sent repair crews to wait wherever each forecast pointed, two hours ahead. Crews cost money
    every time, and pay off when the power goes out, because it comes back sooner. Each dot is one scenario.
  note: >-
    Net savings: what outages cost homes and businesses (Berkeley Lab's outage-cost models) that staged crews avoid,
    minus the cost of staging. Scenarios: crews shorten outages by 10% or 25%; staging costs $5,000 or $20,000 per
    county per 6 hours. Every forecast stages by the same rule, set on 2020–2024 data. Two of the four inputs are
    assumptions, so this is the least certain number on the page.
  labels:
    perfect: Perfect foresight
    headline: Model + last five HRRR forecasts
    model: Model, weather observed so far
    official: Warnings + outlook
  # {cut}: how much crews shorten outages; {cost}: staging cost
  tip: "crews shorten outages {cut}, staging ${cost} per county"

end:
  menu: What's next
  kicker: What's next
  title: From one test year to a live forecast.
  next:                                 # the three cards
    - title: More test years
      text: >-
        Each year is decided by a handful of storms. Testing on 2023 and 2024 as well shows how much the result moves
        from year to year.
    - title: A live test
      text: Publish predictions before storms happen, and score them when the outage data comes out.
    - title: Better place data
      text: Which utility serves each county, and trees near power lines rather than county-wide.
  dashboard: Open the dashboard
  writeup: Read the full write-up
  code: Code on GitHub
  credits: >-
    Ugo Bruzadin Nunes · Data: DOE / ORNL EAGLE-I, NOAA HRRR via Open-Meteo and the University of Utah HRRR archive,
    NOAA Storm Events, NWS and SPC via the Iowa Environmental Mesonet, USFS / NLCD Tree Canopy, U.S. Census Bureau.
