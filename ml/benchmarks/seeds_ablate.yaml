# Canopy and antecedent rain, each repeated with 5 seeds, so their effects can be
# compared with the seed-to-seed noise. Validation year 2024 and unseen counties
# within 2020–2024; 2025 is not loaded.
name: seeds_ablate
description: >
  Canopy removed and antecedent rain added, against weather+place+recent, 5 seeds each,
  at >= 5% and 10% of customers, on 2020–2023 → 2024 and unseen counties (2020–2024).

data:
  threshold_pct: [5, 10]
  years: [2020, 2021, 2022, 2023, 2024]
  train_on: all

rank_by: onset_pr_auc

splits:
  - kind: time
    train_years: [2020, 2021, 2022, 2023]
    test_years: [2024]
  - kind: county
    folds: 5

features:
  - weather+place+recent
  - weather+place+recent-canopy
  - weather+place+recent+wet_soil

models:
  - name: xgboost
    params: {n_estimators: 800, learning_rate: 0.03, max_depth: 4, min_child_weight: 20,
             subsample: 0.8, colsample_bytree: 0.8, random_state: [0, 1, 2, 3, 4]}
