# The tuning grid's top is flat (top 10 within ±1.2% on 2024), so one run can't pick a
# winner. The leading candidates, with and without history, each repeated with 5 seeds:
# compare means, and use the spread across seeds as the noise level.
name: seeds_tune
description: >
  Leading XGBoost settings from tune.yaml, with and without as-of history, 5 seeds each,
  on 2020–2023 → 2024 (validation), >= 5% of customers.

data:
  threshold_pct: [5]
  years: [2020, 2021, 2022, 2023, 2024]
  train_on: all

rank_by: onset_pr_auc

splits:
  - kind: time
    train_years: [2020, 2021, 2022, 2023]
    test_years: [2024]

features:
  - weather+place+recent
  - weather+place+history+recent

models:
  - name: xgboost
    params: {n_estimators: 800, learning_rate: 0.03, max_depth: 4, min_child_weight: 20,
             subsample: 0.8, colsample_bytree: 0.8, random_state: [0, 1, 2, 3, 4]}
  - name: xgboost
    params: {n_estimators: 400, learning_rate: 0.03, max_depth: 8, min_child_weight: 20,
             subsample: 0.8, colsample_bytree: 0.8, random_state: [0, 1, 2, 3, 4]}
  - name: xgboost
    params: {n_estimators: 800, learning_rate: 0.06, max_depth: 4, min_child_weight: 20,
             subsample: 0.8, colsample_bytree: 0.8, random_state: [0, 1, 2, 3, 4]}
