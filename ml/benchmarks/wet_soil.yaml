# Does rain before the storm help? Wet ground lets trees uproot in winds that dry
# ground would hold. Each feature set is run with and without the wet_soil group,
# with both tree models, so one model's ablation is not taken as the answer.
name: wet_soil
description: >
  Antecedent rain (72 h and 7 days before the block, and gust x 72 h rain) on and off (opt-in group: no consistent gain),
  LightGBM and XGBoost, at >= 5% and 10% of customers, on 2024 → 2025 and unseen counties.
  Ranked by onset PR-AUC.

data:
  threshold_pct: [5, 10]
  years: [2024, 2025]
  train_on: [all, onsets]

rank_by: onset_pr_auc

splits:
  - kind: time
    train_years: [2024]
    test_years: [2025]
  - kind: county
    folds: 5

features:
  - weather+place
  - weather+place+wet_soil
  - weather+place+history+recent
  - weather+place+history+recent+wet_soil

models:
  - name: lightgbm
    params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50,
             subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  - name: xgboost
    params: {n_estimators: 400, learning_rate: 0.03, max_depth: 4, min_child_weight: 5,
             subsample: 0.8, colsample_bytree: 0.8}
