# weathernext-outage-forecasting's setup, reproduced on this project's data, next to this
# project's own. Theirs: weather features only, a boosted tree and a logistic regression with
# BigQuery ML's auto class weights, 80/20 split by hash of county + date, scored with
# precision / recall / F1 at 0.5 and ROC-AUC. Same label as here (peak >= 5% of customers).
# Their WeatherNext forecasts are replaced by HRRR (see the weathernext feature group).
#   boosted tree   BQML BOOSTED_TREE_CLASSIFIER, their config: 50 iterations, learn rate 0.1,
#                  min child weight 5, subsample 0.8, BQML's default depth 6
name: weathernext
description: >
  weathernext-outage-forecasting's features, models and class weighting on MO/IL data,
  scored on random region-days (their split), unseen counties and next year, next to the
  final model. >= 5% of customers.

data:
  threshold_pct: [5]
  years: [2020, 2021, 2022, 2023, 2024, 2025]
  train_on: [all]

rank_by: onset_pr_auc

splits:
  - kind: random
    folds: 5
  - kind: county
    folds: 5
  - kind: time
    train_years: [2020, 2021, 2022, 2023, 2024]
    test_years: [2025]

features:
  - weathernext

models:
  - name: xgboost
    params: {n_estimators: 50, learning_rate: 0.1, max_depth: 6, min_child_weight: 5, subsample: 0.8,
             class_weight: balanced}
  - name: logistic
    params: {class_weight: balanced}
  - name: xgboost             # this project's final model
    features: [weather+place+recent]
    params: {n_estimators: 800, learning_rate: 0.03, max_depth: 4, min_child_weight: 20,
             subsample: 0.8, colsample_bytree: 0.8}
