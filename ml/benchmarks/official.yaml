# Does the model beat the official forecasts a utility already has? And does it add to them?
#   nws_warnings  event rate by which NWS warnings were in force in the block
#   spc_outlook   event rate by SPC Day 1 categorical risk (issued before the block)
#   official      both together
# then XGBoost on the official forecasts alone, on the model's own features, and on both.
# Warnings are issued minutes ahead, often inside the block, like the HRRR features;
# the outlook is issued hours ahead.
name: official
description: >
  NWS warnings and SPC outlooks as baselines, and as features, against the model,
  at >= 1%, 5% and 10% of customers, on 2024 → 2025 and unseen counties. Ranked by onset PR-AUC.

data:
  threshold_pct: [1, 5, 10]
  years: [2024, 2025]
  train_on: [all]

rank_by: onset_pr_auc

splits:
  - kind: time
    train_years: [2024]
    test_years: [2025]
  - kind: county
    folds: 5

features:
  - warnings+outlook
  - weather+place+history
  - weather+place+history+warnings+outlook
  - weather+place+history+recent
  - weather+place+history+recent+warnings+outlook

models:
  - name: climatology
  - name: nws_warnings
  - name: spc_outlook
  - name: official
  - name: xgboost
    params: {n_estimators: 400, learning_rate: 0.03, max_depth: 4, min_child_weight: 5,
             subsample: 0.8, colsample_bytree: 0.8}
