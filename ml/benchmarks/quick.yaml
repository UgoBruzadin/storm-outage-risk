# Baselines vs. model families at three outage sizes (~15 min).
# New experiments: copy this file and change one thing at a time.
name: quick
description: >
  Baselines vs. default model families on 2024 → 2025 and unseen counties, for outages of
  >= 1%, 5% and 10% of customers in a 6-hour block. Ranked by onset PR-AUC: how well the
  model predicts NEW outages (the previous block wasn't already an event).

data:
  threshold_pct: [1, 5, 10]   # label: peak % of customers out in the block >= this (each is a separate task)
  years: [2024, 2025]         # years with HRRR weather downloaded
  train_on: all               # all | onsets (or a list of both) — see ml/benchmarks/onsets.yaml

rank_by: onset_pr_auc         # or pr_auc for all blocks

splits:
  - kind: time                # train 2024, test 2025
    train_years: [2024]
    test_years: [2025]
  - kind: county              # 5 folds of held-out regions (both years)
    folds: 5

features:                     # groups in ml/data.py; "+" adds, "-" removes
  - weather                   # ≈ weathernext
  - weather+place+history
  - weather+place+history+recent

models:
  - name: prior               # baseline: the event rate for everyone
  - name: climatology         # baseline: each region's event rate by month
  - name: logistic
    params: {class_weight: balanced}
  - name: lightgbm
    params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50,
             subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  - name: xgboost
    params: {n_estimators: 400, learning_rate: 0.03, max_depth: 6, min_child_weight: 5,
             subsample: 0.8, colsample_bytree: 0.8}

# what `pixi run export-app` trains for the dashboard. XGBoost: tied with LightGBM after
# tuning (ml/results/leaderboard_full.md) and ~1.6x faster to train. Depth 4 generalized best
# to the next year; up-weighting rare events (scale_pos_weight) hurt.
final:
  model: xgboost
  params: {n_estimators: 400, learning_rate: 0.03, max_depth: 4, min_child_weight: 5,
           subsample: 0.8, colsample_bytree: 0.8}
  features: weather+place+history+recent
  threshold_pct: 5
