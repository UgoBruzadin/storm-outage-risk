name: lab
data:
  threshold_pct:
  - 5
  years:
  - 2024
  - 2025
  train_on:
  - all
rank_by: onset_pr_auc
splits:
- kind: time
  train_years:
  - 2024
  test_years:
  - 2025
features:
- weather
- weather+place
- weather+place-canopy
models:
- name: climatology
- name: xgboost
  params:
    n_estimators: 400
    learning_rate: 0.03
    max_depth:
    - 4
    - 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.8
