# Hyperparameter grids for the boosted-tree models, plus the place/canopy ablation.
# A few hours (3 outage sizes). Check the run count first: pixi run benchmark ml/benchmarks/full.yaml --dry-run
name: full
description: >
  Grid search over LightGBM / XGBoost / HGB, with the canopy ablation, on 2024 → 2025
  and unseen counties. Outages of >= 1%, 5% and 10% of customers in a 6-hour block, ranked on new outages (onsets).

data:
  threshold_pct: [1, 5, 10]
  years: [2024, 2025]

rank_by: onset_pr_auc         # new outages: the hard, useful part

splits:
  - kind: time
    train_years: [2024]
    test_years: [2025]
  - kind: county
    folds: 5

features:
  - weather
  - weather+place
  - weather+place-canopy
  - weather+place+history
  - weather+place+history+recent
  - weather+place+history+recent-canopy

models:
  - name: prior
  - name: climatology
  # 1. ablation: one fixed LightGBM, every feature set — does place / canopy help?
  - name: lightgbm
    params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50,
             subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  # 2. grid search on the richest feature set
  - name: lightgbm
    features: [weather+place+history+recent]
    params:
      n_estimators: [300, 800]
      learning_rate: [0.02, 0.05]
      num_leaves: [15, 63]
      min_child_samples: [50]
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      scale_pos_weight: [1, 10]     # up-weight the rare events
  - name: xgboost
    features: [weather+place+history+recent]
    params:
      n_estimators: [400, 800]
      learning_rate: [0.03]
      max_depth: [4, 8]
      min_child_weight: [5, 20]
      subsample: 0.8
      colsample_bytree: 0.8
      scale_pos_weight: [1, 10]
  - name: hgb
    features: [weather+place+history+recent]
    params:
      learning_rate: [0.05]
      max_iter: [300, 600]
      max_leaf_nodes: [31, 63]
      l2_regularization: 1.0

# The dashboard's model (`final:`) lives in ml/benchmarks/final_2025.yaml.
