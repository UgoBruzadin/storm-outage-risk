# Predicting NEW outages: train on every block, or only on onset blocks?
# A model trained on everything learns "if it's out, it stays out" — great on all blocks,
# but that knowledge is useless for onsets. Training on onsets only forces it to learn
# what turns a calm block into an outage: the weather and the place.
name: onsets
description: >
  LightGBM trained on all blocks vs. onset blocks only, at >= 1%, 5% and 10% of customers,
  on 2024 → 2025 and unseen counties. Ranked by onset PR-AUC.

data:
  threshold_pct: [1, 5, 10]
  years: [2024, 2025]
  train_on: [all, onsets]

rank_by: onset_pr_auc

splits:
  - kind: time
    train_years: [2024]
    test_years: [2025]
  - kind: county
    folds: 5

features:
  - weather
  - weather+place
  - weather+place-canopy
  - weather+place+history
  - weather+place+history+recent

models:
  - name: climatology
  - name: lightgbm
    params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50,
             subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}

final:
  model: lightgbm
  params: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 50,
           subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  features: weather+place+history+recent
  threshold_pct: 5
